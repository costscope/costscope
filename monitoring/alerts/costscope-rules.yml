groups:
  - name: costscope.rules
    rules:
      - alert: CostScopeHighErrorRate
        expr: sum(rate(costscope_http_requests_total{status=~"5.."}[5m])) / sum(rate(costscope_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on CostScope"
          description: "The proportion of 5xx responses exceeded 5% over the last 5 minutes."
      - alert: CostScopeHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(costscope_http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on CostScope"
          description: "p95 request latency exceeded 500ms over the last 10 minutes."
