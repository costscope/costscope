#[[ Configuration for git-cliff to generate Keep a Changelog compliant sections ]]

[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n## [Unreleased]\n"
body = """
{% if commits | length %}
{% for group, group_commits in commits | group_by(attribute="group") %}
{% if group_commits | length %}
### {{ group }}
{% for commit in group_commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}{% if commit.breaking %} **(BREAKING)**{% endif %}
{% endfor %}
{% endif %}
{% endfor %}
{% else %}
No changes.
{% endif %}
"""
footer = "\n<!-- Generated by git-cliff -->\n"
trim = true
link_parsers = ["github"]

[git]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Chore" },
  { message = "^security", group = "Security" },
  { message = "BREAKING CHANGE", group = "Breaking" },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = true
sort_commits = "newest"

[bump]
initial_tag = "v0.1.0-rc1"
