components:
  schemas:
    Envelope:
      type: object
      description: Unified response envelope (additive, backward-compatible). Domain payload appears under data.
      properties:
        success:
          type: boolean
          description: Indicates whether the request was successful.
        data:
          description: Domain payload (type varies per endpoint).
          nullable: true
        error:
          $ref: "#/components/schemas/EnvelopeError"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
      required: [success]
    EnvelopeMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
        source:
          type: string
        extra:
          type: object
          additionalProperties: true
    EnvelopeError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required: [message]
    EnvelopeHealth:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
              required: [status]
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

tags:
  - name: Health
    description: Health check endpoints
  - name: Analytics
  - name: FOCUS
