# Template OpenAPI (FOCUS) - placeholders http://localhost:8080 ws://localhost:8080
# Template consumed by Go generator (cmd/tools/gen-openapi)
openapi: 3.1.0
info:
  title: CostScope FOCUS API
  description: |
    Enterprise REST API for FOCUS (FinOps Open Cost and Usage Specification) operations.

    This API provides comprehensive cost management functionality including:
    - FOCUS data conversion from cloud billing data
    - Cost analysis with ML-powered insights
    - Dataset comparison and anomaly detection
    - FOCUS compliance validation
    - Real-time job progress monitoring via WebSocket

    ## Authentication
    All endpoints require JWT Bearer token authentication:
    ```
    Authorization: Bearer <your-jwt-token>
    ```

    ## Rate Limiting
    API requests are rate limited to 100 requests per minute per API key.

    ## WebSocket Updates
    Connect to WebSocket endpoints for real-time job progress updates:
    ```
    ws://localhost:8080/ws/jobs/{job_id}
    ```
  version: 1.0.0
  contact:
    name: CostScope API Support
    email: api-support@costscope.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: "http://localhost:8080"
    description: Development server
  - url: https://api.costscope.io
    description: Production server

# NOTE: The rest of the spec is copied from the current openapi.yaml; only base URLs/websocket examples are templated.
# For brevity in this template we include minimal paths; extend as needed or keep full spec.
paths:
  /health:
    get:
      summary: Health check
      description: Check API server health status
      tags: [Health]
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHealth"
  /api/v1/analytics/summary:
    get:
      summary: Get cost summary
      tags: [Analytics]
      parameters:
        - in: query
          name: input
          required: false
          description: Optional path/URL to FOCUS parquet file; if omitted, the server uses its configured default dataset.
          schema:
            type: string
      responses:
        "200":
          description: Summary returned
  /api/v1/analytics/top-services:
    get:
      summary: Top services by effective cost
      tags: [Analytics]
      parameters:
        - in: query
          name: input
          required: false
          description: Optional path/URL to FOCUS parquet file; if omitted, the server uses its configured default dataset.
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, default: 5 }
      responses:
        "200":
          description: Top services returned
  /api/v1/analytics/trends:
    get:
      summary: Cost trends by time
      tags: [Analytics]
      parameters:
        - in: query
          name: input
          required: false
          description: Optional path/URL to FOCUS parquet file; if omitted, the server uses its configured default dataset.
          schema:
            type: string
        - in: query
          name: granularity
          required: false
          schema:
            type: string
            enum: [hour, day, week, month, year]
            default: day
      responses:
        "200":
          description: Trend series
  /api/v1/focus/schemas:
    get:
      summary: List supported FOCUS schema versions
      description: Returns supported FOCUS schema identifiers (descending semantic version) with latest alias.
      tags: [FOCUS]
      responses:
        "200":
          description: Schemas listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                    example: ["focus-1.2", "focus-1.1", "focus-1.0"]
                  latest:
                    type: string
                    example: focus-1.2
                  count:
                    type: integer
                    example: 3
  # Async FOCUS conversion jobs
  /api/v1/focus/conversions:
    post:
      summary: Submit a FOCUS conversion job
      tags: [FOCUS]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string, enum: [aws, azure, gcp] }
                input_path: { type: string }
                output_path: { type: string }
                streaming: { type: boolean }
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data:
                  job_id: job_1737567890123456000
                  status: accepted
                error: null
                meta:
                  timestamp: 2025-08-24T10:20:17Z
    get:
      summary: List active conversion jobs
      tags: [FOCUS]
      responses:
        "200":
          description: Active jobs listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data:
                  jobs:
                    - id: job_1737567890123456000
                      status: running
                      started_at: 2025-08-24T10:20:17Z
                      progress:
                        mapped_records: 125000
                        percent_complete: 42.7
                    - id: job_1737567000000000000
                      status: queued
                      started_at: null
                      progress: {}
                  total: 2
                error: null
                meta:
                  timestamp: 2025-08-24T10:20:18Z
  /api/v1/focus/conversions/{id}:
    get:
      summary: Get conversion job status
      tags: [FOCUS]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data:
                  id: job_1737567890123456000
                  status: running
                  started_at: 2025-08-24T10:20:17Z
                  progress:
                    mapped_records: 150000
                    percent_complete: 51.3
                error: null
                meta:
                  timestamp: 2025-08-24T10:20:19Z
        "404": { description: Not found }
    delete:
      summary: Cancel a running conversion job
      tags: [FOCUS]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancellation acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data:
                  id: job_1737567890123456000
                  status: cancelled
                error: null
                meta:
                  timestamp: 2025-08-24T10:20:20Z
        "404": { description: Not found }
  /api/v1/focus/conversions/history:
    get:
      summary: List completed conversion jobs
      tags: [FOCUS]
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: History listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                success: true
                data:
                  history:
                    - id: job_1737567000000000000
                      input_file: s3://bucket/cur-2025-08.csv.gz
                      output_file: costscope-data/focus/cur-2025-08.parquet
                      success: true
                      duration_ms: 48210
                      records_in: 350000
                      records_out: 350000
                    - id: job_1737566500000000000
                      input_file: /data/aws-cur.csv.gz
                      output_file: costscope-data/focus/aws-cur.parquet
                      success: false
                      duration_ms: 1023
                      records_in: 0
                      records_out: 0
                  total: 2
                error: null
                meta:
                  timestamp: 2025-08-24T10:20:21Z

