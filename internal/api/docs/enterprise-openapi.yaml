components:
  schemas:
    Envelope:
      type: object
      description: Unified response envelope (additive, backward-compatible). Domain payload appears under data.
      properties:
        success:
          type: boolean
        data:
          description: Domain payload (type varies per endpoint).
          nullable: true
        error:
          $ref: "#/components/schemas/EnvelopeError"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
      required: [success]
    EnvelopeMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        request_id:
          type: string
        source:
          type: string
        extra:
          type: object
          additionalProperties: true
    EnvelopeError:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required: [message]
    ReportExportMetadata:
      type: object
      properties:
        id: { type: string }
        path: { type: string }
        format: { type: string }
        size_bytes: { type: integer }
        checksum_sha256: { type: string }
        created_at: { type: string, format: date-time }
        output_dir_source: { type: string }
      required: [id, path, format, created_at]
    EnvelopeHealth:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                status:
                  type: string
                  example: healthy
              required: [status]
    EnvelopeAnalyticsSummary:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                summary:
                  type: object
                  additionalProperties: true
                generated_at:
                  type: string
                  format: date-time
          description: Envelope containing analytics cost summary.
    EnvelopeAnalyticsTopServices:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                top_services:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                generated_at:
                  type: string
                  format: date-time
          description: Envelope containing top services by effective cost.
    EnvelopeAnalyticsTrends:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                trends:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                granularity:
                  type: string
                generated_at:
                  type: string
                  format: date-time
          description: Envelope containing cost trends time series.
    # --------------------------------------
    # FOCUS Conversion Job Schemas
    # --------------------------------------
    FocusConversionSubmitRequest:
      type: object
      required: [provider, input_path, output_path]
      properties:
        provider: { type: string, enum: [aws, azure, gcp] }
        input_path: { type: string }
        output_path: { type: string }
        streaming: { type: boolean, default: false }
        chunk_size: { type: integer, minimum: 1 }
        workers: { type: integer, minimum: 1 }
        use_unified_mapper: { type: boolean }
        invariants_enabled: { type: boolean }
        invariants_baseline: { type: string }
        invariants_tolerance: { type: number, format: float }
    FocusConversionSubmitResponse:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string, example: accepted }
    FocusConversionJob:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        progress:
          type: object
          additionalProperties: true
    FocusConversionJobDetailed:
      allOf:
        - $ref: "#/components/schemas/FocusConversionJob"
        - type: object
          properties:
            completed_at: { type: string, format: date-time, nullable: true }
            result:
              type: object
              additionalProperties: true
    FocusConversionHistoryEntry:
      type: object
      properties:
        id: { type: string }
        input_file: { type: string }
        output_file: { type: string }
        success: { type: boolean }
        duration_ms: { type: integer }
        records_in: { type: integer }
        records_out: { type: integer }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Analytics
  - name: Streaming
  - name: FOCUS
  - name: Reports
    description: Report generation, export metadata and integrity verification
