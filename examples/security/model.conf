# Simple path-based model (matches configs/rbac_model.conf.example)
[request_definition]
# subject, object (path), action (method)
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act) && (r.sub == p.sub)
