name: Perf + Parity Guard

on:
  push:
    # Temporary: run on push; will migrate some to tags later
    branches: [main]
    paths:
      - internal/core/focus/conversion/**
      - scripts/tools/perf-bench/**
      - scripts/tools/parity-check/**
      - tests/perf/**
      - Makefile
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    paths:
      - internal/core/focus/conversion/**
      - scripts/tools/perf-bench/**
      - scripts/tools/parity-check/**
      - tests/perf/**
      - Makefile
      - go.mod
      - go.sum
  workflow_dispatch: {}

jobs:
  lint-on-push:
    if: ${{ github.event_name == 'push' }}
    name: lightweight checks on push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go version
        run: go version
      - name: Module sanity
        run: bash scripts/ci/module-sanity.sh
      - name: Summary
        run: |
          echo '### perf-parity (lint on push)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified Go toolchain and module listing. Full perf+parity runs remain gated to PR/dispatch.' >> "$GITHUB_STEP_SUMMARY"
  # Make act detection available to job-level if conditions
  _env_init:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.set.outputs.is_act }}
      act_full: ${{ steps.set.outputs.act_full }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          IS_ACT_VAL=false
          if [ "${IS_ACT:-}" = "true" ] || [ "${ACT:-}" = "true" ] || [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then
            IS_ACT_VAL=true
          fi
          if [ "${ACT_FULL:-false}" = "true" ]; then
            ACT_FULL_VAL=true
          else
            ACT_FULL_VAL=false
          fi
          echo "is_act=${IS_ACT_VAL}" >> "$GITHUB_OUTPUT"
          echo "act_full=${ACT_FULL_VAL}" >> "$GITHUB_OUTPUT"
  noop-act:
    # Skip heavy jobs under local act runs; show a noop message instead
    needs: _env_init
    if: ${{ needs._env_init.outputs.is_act == 'true' && needs._env_init.outputs.act_full != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: echo "Perf + Parity guard skipped under act; use 'make perf-parity' locally if needed."
  perf-parity:
    # Allow skipping under act to avoid long compute and flaky environment
    needs: _env_init
    if: ${{ needs._env_init.outputs.is_act != 'true' || needs._env_init.outputs.act_full == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup Go
        # pinned actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 — source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v4
        with:
          go-version-file: go.mod
          # Speed up dependency restores
          cache: true
          cache-dependency-path: go.sum

      - name: Download deps
        run: go mod download

      - name: Build slim binary
        run: make build-slim

      # perf-parity target will auto-generate synthetic dataset if missing via perf-short
      # (kept lean to avoid duplicated work)

      - name: Run perf+parity
        run: bash scripts/ci/perf-parity-run.sh

      - name: Upload artifacts
        if: ${{ always() && github.actor != 'nektos/act' }}
        # pinned actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 — source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: perf-parity-artifacts
          path: |
            bench_results.json
            perf_metrics.prom
            .cache/parquet/aws_legacy*.parquet
            .cache/parquet/aws_unified*.parquet
