name: Perf + Parity Guard

on:
  push:
    branches: [main]
    paths:
      - internal/core/focus/conversion/**
      - scripts/tools/perf-bench/**
      - scripts/tools/parity-check/**
      - tests/perf/**
      - Makefile
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    paths:
      - internal/core/focus/conversion/**
      - scripts/tools/perf-bench/**
      - scripts/tools/parity-check/**
      - tests/perf/**
      - Makefile
      - go.mod
      - go.sum
  workflow_dispatch: {}

jobs:
  # Make act detection available to job-level if conditions
  _env_init:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.set.outputs.is_act }}
    steps:
      - id: set
        run: echo "is_act=${{ github.actor == 'nektos/act' }}" >> "$GITHUB_OUTPUT"
  noop-act:
    # Skip heavy jobs under local act runs; show a noop message instead
    needs: _env_init
    if: ${{ needs._env_init.outputs.is_act == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: echo "Perf + Parity guard skipped under act; use 'make perf-parity' locally if needed."
  perf-parity:
    # Allow skipping under act to avoid long compute and flaky environment
    needs: _env_init
    if: ${{ needs._env_init.outputs.is_act != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Go
        # pinned actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 — source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
        with:
          go-version-file: go.mod
          # Speed up dependency restores
          cache: true
          cache-dependency-path: go.sum

      - name: Download deps
        run: go mod download

      - name: Build slim binary
        run: make build-slim

      # perf-parity target will auto-generate synthetic dataset if missing via perf-short
      # (kept lean to avoid duplicated work)

      - name: Run perf+parity
        run: make perf-parity

      - name: Upload artifacts
        if: ${{ always() && github.actor != 'nektos/act' }}
        # pinned actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 — source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-parity-artifacts
          path: |
            bench_results.json
            perf_metrics.prom
            .cache/parquet/aws_legacy*.parquet
            .cache/parquet/aws_unified*.parquet
