name: Config Validation

on:
  pull_request:
    paths:
      - "configs/**/*.yaml"
      - "scripts/tools/config-validate/**"
      - "internal/core/config/**"
      - ".github/workflows/config-validate.yml"
  push:
    branches: [main]
    paths:
      - "configs/**/*.yaml"
      - "scripts/tools/config-validate/**"
      - "internal/core/config/**"

jobs:
  config-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pinned actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 1

      - name: Set up Go
        # pinned actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c - source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: go.mod

      - name: Run config validation
        run: make config-validate
