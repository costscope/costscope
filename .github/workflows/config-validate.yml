name: Config Validation

on:
  pull_request:
    paths:
      - "configs/**/*.yaml"
      - "scripts/tools/config-validate/**"
      - "internal/core/config/**"
      - ".github/workflows/config-validate.yml"
  push:
    branches: [main]
    paths:
      - "configs/**/*.yaml"
      - "scripts/tools/config-validate/**"
      - "internal/core/config/**"

jobs:
  config-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # pinned actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd - source: https://github.com/actions/checkout/commits/main (2025-09-28)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Set up Go
        # pinned actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 - source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Run config validation
        run: make config-validate
