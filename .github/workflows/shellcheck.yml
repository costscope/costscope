name: shellcheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-shell:
    runs-on: ubuntu-latest
    # Run inside official ShellCheck container to avoid apt installs and speed up under act
    container:
      image: koalaman/shellcheck-alpine:stable
    steps:
      - name: Checkout
        # pinned actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Run ShellCheck
        shell: sh
        run: sh ./scripts/ci/run-shellcheck.sh
