name: shellcheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-shell:
    runs-on: ubuntu-latest
    # Run inside official ShellCheck container to avoid apt installs and speed up under act
    container:
      image: koalaman/shellcheck-alpine:stable
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Run ShellCheck
        shell: sh
        run: sh ./scripts/ci/run-shellcheck.sh
