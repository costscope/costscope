name: Build and smoke-test Docker release

on:
  push:
    # Temporary: run on push; will migrate some to tags later
    branches: [main]
  workflow_dispatch: {}

env:
  GO_VERSION: "1.24.6"
  # Tag to apply alongside the version tag is resolved at runtime from CI_IMAGE_TAG env if present,
  # otherwise defaults to 'latest'. For local ACT runs, CI_IMAGE_TAG is taken from .github/act.env.

jobs:
  lint-on-push:
    if: ${{ github.event_name == 'push' }}
    name: lightweight checks on push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Detect ACT
        id: detect_lint
        shell: bash
        run: |
          if [[ "${ACT:-}" == "true" || "${IS_ACT:-}" == "true" || "${NEKTOS_ACT:-}" == "true" ]]; then
            echo "Detected ACT environment"
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not ACT"
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Diagnose vendored actions (ACT)
        if: ${{ steps.detect_lint.outputs.is_act == 'true' }}
        run: |
          echo "Listing .github/_actions (if present)"
          ls -la .github/_actions || true
          echo "Probe for Node action entrypoints:"
          find .github/_actions -maxdepth 3 -type f -name 'index.js' -print 2>/dev/null || true
      - name: Set up Go (ACT)
        if: ${{ steps.detect_lint.outputs.is_act == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) platform=linux-amd64;;
            aarch64|arm64) platform=linux-arm64;;
            *) echo "Unsupported arch: $arch" >&2; exit 1;;
          esac
          url="https://go.dev/dl/go${GO_VERSION}.${platform}.tar.gz"
          echo "Downloading $url"
          curl -fsSLo /tmp/go.tgz "$url"
          rm -rf /usr/local/go || true
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Set up Go
        if: ${{ steps.detect_lint.outputs.is_act != 'true' }}
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go version
        run: go version
      - name: Verify release assets exist
        run: |
          set -euo pipefail
          test -f Dockerfile || { echo "Missing Dockerfile" >&2; exit 1; }
          test -f Dockerfile.release || { echo "Missing Dockerfile.release" >&2; exit 1; }
          test -f scripts/ci/compute-version-vars.sh || { echo "Missing scripts/ci/compute-version-vars.sh" >&2; exit 1; }
      - name: Dry-run version vars script
        run: |
          bash scripts/ci/compute-version-vars.sh || true
      - name: Summary
        run: |
          echo '### docker-release (lint on push)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checked Go toolchain, verified Dockerfiles and version script. Full build/smoke remains gated to manual dispatch.' >> "$GITHUB_STEP_SUMMARY"
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # pinned actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Detect ACT (early)
        id: detect_early
        shell: bash
        run: |
          if [[ "${ACT:-}" == "true" || "${IS_ACT:-}" == "true" || "${NEKTOS_ACT:-}" == "true" ]]; then
            echo "Detected ACT environment"
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not ACT"
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose vendored actions (ACT)
        if: ${{ steps.detect_early.outputs.is_act == 'true' }}
        run: |
          echo "Listing .github/_actions (if present)"
          ls -la .github/_actions || true
          echo "Probe for Node action entrypoints:"
          find .github/_actions -maxdepth 3 -type f -name 'index.js' -print 2>/dev/null || true

      - name: Set up Go (ACT)
        if: ${{ steps.detect_early.outputs.is_act == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) platform=linux-amd64;;
            aarch64|arm64) platform=linux-arm64;;
            *) echo "Unsupported arch: $arch" >&2; exit 1;;
          esac
          url="https://go.dev/dl/go${GO_VERSION}.${platform}.tar.gz"
          echo "Downloading $url"
          curl -fsSLo /tmp/go.tgz "$url"
          rm -rf /usr/local/go || true
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
      - name: Set up Go
        if: ${{ steps.detect_early.outputs.is_act != 'true' }}
        # pinned actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c — source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: "Sanity: go version"
        run: go version
      - name: Set version variables
        id: vars
        shell: bash
        run: |
          bash scripts/ci/compute-version-vars.sh
      - name: Echo computed env
        run: |
          echo "VERSION=${{ steps.vars.outputs.version }}"
          echo "COMMIT=${{ steps.vars.outputs.commit }}"
          echo "BUILD_DATE=${{ steps.vars.outputs.build_date }}"
          echo "GOVERSION=${{ steps.vars.outputs.go_version }}"
          echo "SOURCE_REPO=${{ steps.vars.outputs.source_repo }}"

      - name: Resolve CI_IMAGE_TAG
        id: tag
        shell: bash
        run: |
          # Prefer externally supplied CI_IMAGE_TAG (e.g., repo env/Secrets or ACT .github/act.env); fallback to 'latest'
          RESOLVED_TAG="${CI_IMAGE_TAG:-latest}"
          echo "Resolved CI_IMAGE_TAG=${RESOLVED_TAG}"
          echo "CI_IMAGE_TAG=${RESOLVED_TAG}" >> "$GITHUB_ENV"
          echo "ci_image_tag=${RESOLVED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Detect ACT
        id: detect
        shell: bash
        run: |
          if [[ "${ACT:-}" == "true" || "${IS_ACT:-}" == "true" || "${NEKTOS_ACT:-}" == "true" ]]; then
            echo "Detected ACT environment"
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not ACT"
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        # Skip under ACT local runs
        if: ${{ steps.detect.outputs.is_act != 'true' }}
        run: make build-release

      - name: Note ACT environment (skipped release build)
        if: ${{ steps.detect.outputs.is_act == 'true' }}
        run: echo "Running under ACT; skipped make build-release"

      - name: Build Docker image (Dockerfile.release)
        if: ${{ steps.detect.outputs.is_act != 'true' }}
        # pinned docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 — source: https://github.com/docker/build-push-action/commits/v4 (2025-09-28)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v4
        with:
          context: .
          file: Dockerfile.release
          tags: |
            costscope:${{ steps.vars.outputs.version }}
            costscope:${{ steps.tag.outputs.ci_image_tag }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            GOVERSION=${{ steps.vars.outputs.go_version }}
            SOURCE_REPO=${{ steps.vars.outputs.source_repo }}

      - name: Inspect image labels
        if: ${{ steps.detect.outputs.is_act != 'true' }}
        run: docker image inspect --format '{{json .Config.Labels}}' costscope:${{ steps.vars.outputs.version }}

      - name: Run version inside image
        if: ${{ steps.detect.outputs.is_act != 'true' }}
        run: docker run --rm --entrypoint ./costscope costscope:${{ steps.vars.outputs.version }} version

      - name: Start container and wait for ready
        if: ${{ steps.detect.outputs.is_act != 'true' }}
        run: |
          # Provide a deterministic development JWT secret to satisfy server startup policy (>=32 bytes)
          docker run -d --name costscope-test -p 8080:8080 \
            -e COSTSCOPE_JWT_SECRET="dev-smoke-secret-0123456789ABCDEF-32+" \
            costscope:${{ steps.vars.outputs.version }}
          bash scripts/ci/docker-wait-ready.sh http://127.0.0.1:8080/health/ready 20 3

      - name: Stop container (always)
        if: ${{ always() && steps.detect.outputs.is_act != 'true' }}
        run: |
          docker rm -f costscope-test || true

      - name: Note ACT environment (skipped docker build/run)
        if: ${{ steps.detect.outputs.is_act == 'true' }}
        run: echo "Running under ACT; skipped Docker image build and runtime checks"
