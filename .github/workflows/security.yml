name: Security Suite
env:
  RUN_UPLOADS: "true"
  # Centralized tool versions (override defaults in Makefile scripts)
  GITLEAKS_VERSION: latest
  GOSEC_VERSION: latest
  GOVULNCHECK_VERSION: latest
  # Align with supply-chain and release workflows for consistency
  SYFT_VERSION: v1.33.0
  COSIGN_VERSION: v2.2.4
  # Pinned to align with CI; used by scripts/security/run-trivy-*.sh
  TRIVY_VERSION: "0.56.2"
  # Tools container image default (will be overridden by guard job output)
  CI_TOOLS_IMAGE: ghcr.io/costscope/ci-base:latest

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  require-ci-tools-image-pin:
    if: ${{ github.actor != 'nektos/act' }}
    name: Require CI tools image pin (no drift)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ci_tools_image: ${{ steps.check.outputs.ci_tools_image }}
    steps:
      - name: Load CI_TOOLS_IMAGE from repository variables (if set)
        env:
          GH_API: https://api.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          name="CI_TOOLS_IMAGE"
          url="${GH_API}/repos/${owner}/${repo}/actions/variables/${name}"
          hdrs=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          status=$(curl -sS -o /tmp/var.json -w "%{http_code}" "${hdrs[@]}" "$url") || true
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            # naive JSON extraction for 'value' field without jq
            val=$(sed -n 's/.*"value"\s*:\s*"\{0,1\([^"}]*\)\{0,1\}".*/\1/p' /tmp/var.json | head -n1)
            if [ -n "$val" ]; then
              echo "CI_TOOLS_IMAGE=$val" >> "$GITHUB_ENV"
              echo "Loaded CI_TOOLS_IMAGE from repository variable: $val"
            fi
          else
            echo "No repository variable CI_TOOLS_IMAGE found (status $status); using workflow env default."
          fi
      - name: Enforce non-floating CI_TOOLS_IMAGE
        id: check
        run: |
          set -euo pipefail
          IMAGE="${CI_TOOLS_IMAGE:-}"
          if [ -z "$IMAGE" ]; then
            echo "[warn] CI_TOOLS_IMAGE not set in workflow env."
            echo "       Set Settings → Variables → Actions → CI_TOOLS_IMAGE to an immutable tag or digest, e.g.:"
            echo "         ghcr.io/costscope/ci-base:2025-10-10-<shortsha>"
            echo "         or ghcr.io/costscope/ci-base@sha256:<digest>"
            echo "       Optionally update this workflow env to reference the Actions variable."
            IMAGE="ghcr.io/costscope/ci-base:latest"
          fi
          if echo "$IMAGE" | grep -qE ':(latest|main|dev)$'; then
            echo "[error] CI_TOOLS_IMAGE uses a floating tag ($IMAGE)." >&2
            echo "        Please set repository variable CI_TOOLS_IMAGE to an immutable reference (tag with date/sha or @sha256 digest)." >&2
            echo "        Example: ghcr.io/costscope/ci-base@sha256:<digest>" >&2
            exit 1
          fi
          echo "Using CI_TOOLS_IMAGE: $IMAGE"
          echo "ci_tools_image=$IMAGE" >> "$GITHUB_OUTPUT"
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    name: noop (act)
    runs-on: ubuntu-latest
    steps:
      - name: Explain act path
        run: |
          echo "Security suite is GitHub-centric; under act we skip heavy jobs using job-level guards."
          echo "For local parity, prefer 'make security-tools-install' and 'make security-gate'."
  setup:
    if: ${{ github.actor != 'nektos/act' }}
    name: Prepare Environment
    runs-on: ubuntu-latest
    needs: require-ci-tools-image-pin
    outputs:
      go-version: ${{ steps.vars.outputs.goversion }}
      is-act: ${{ steps.detect.outputs.is_act }}
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Go
        id: go
        # pinned actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 - source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
        with:
          go-version: "1.24.x"
      - name: "Sanity: go version"
        run: go version
      - name: Capture Go version
        id: vars
        run: echo "goversion=${{ steps.go.outputs.go-version }}" >> $GITHUB_OUTPUT
      - name: Detect act runtime
        id: detect
        run: |
          if [[ "${IS_ACT:-}" == "true" || "${ACT:-}" == "true" || "${GITHUB_ACTOR:-}" == "nektos/act" ]]; then
            echo "is_act=true" >> "$GITHUB_OUTPUT"
            echo "Detected act runtime"
          else
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Go modules
        if: ${{ steps.detect.outputs.is_act != 'true' }}
        # pinned actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 - source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

  sbom:
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    name: SBOM
    runs-on: ubuntu-latest
    needs: [setup, require-ci-tools-image-pin]
    env:
      CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Generate SBOM (syft via tools image)
        run: |
          CI_TOOLS_IMAGE="${{ env.CI_TOOLS_IMAGE }}" \
          bash ./scripts/ci/run-in-ci-image.sh -- make sbom
      - if: env.RUN_UPLOADS == 'true'
        # pinned actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 - source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json

  govulncheck:
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    name: govulncheck
    runs-on: ubuntu-latest
    needs: [setup, require-ci-tools-image-pin]
    env:
      CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Run govulncheck (via tools image)
        run: |
          CI_TOOLS_IMAGE="${{ env.CI_TOOLS_IMAGE }}" \
          bash ./scripts/ci/run-in-ci-image.sh -- bash ./scripts/security/run-govulncheck.sh
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: govulncheck
          path: govulncheck.json

  gosec:
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    name: gosec
    runs-on: ubuntu-latest
    needs: [setup, require-ci-tools-image-pin]
    env:
      CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Run gosec (via tools image)
        run: |
          CI_TOOLS_IMAGE="${{ env.CI_TOOLS_IMAGE }}" \
          bash ./scripts/ci/run-in-ci-image.sh -- bash ./scripts/security/run-gosec.sh
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gosec
          path: gosec.json

  secrets:
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    needs: [setup, require-ci-tools-image-pin]
    env:
      CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Run gitleaks (via tools image)
        run: |
          CI_TOOLS_IMAGE="${{ env.CI_TOOLS_IMAGE }}" \
          bash ./scripts/ci/run-in-ci-image.sh -- bash ./scripts/security/run-gitleaks.sh
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks
          path: gitleaks-report.json

  trivy-fs:
    name: trivy fs
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    runs-on: ubuntu-latest
    needs: [setup, require-ci-tools-image-pin]
    env:
      CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Trivy FS (via tools image)
        run: |
          CI_TOOLS_IMAGE="${{ env.CI_TOOLS_IMAGE }}" \
          bash ./scripts/ci/run-in-ci-image.sh -- bash ./scripts/security/run-trivy-fs.sh
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-fs
          path: trivy-fs.json

  build-image:
    name: Build Image
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
        with:
          go-version: ${{ needs.setup.outputs.go-version }}
      - name: Build binary & image
        run: |
          make build-release
          docker build -t costscope:ci .
      - name: Save image
        run: |
          docker save costscope:ci | gzip > image.tar.gz
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-tar
          path: image.tar.gz

  trivy-image:
    name: trivy image
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    runs-on: ubuntu-latest
    needs: [build-image, require-ci-tools-image-pin, setup]
    env:
      CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
    steps:
      - name: Checkout (for fallback build)
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: image-tar
      - name: Load or build image
        run: |
          if [ -f image.tar.gz ]; then
            echo "Loading image from artifact..."
            docker load -i image.tar.gz
          else
            echo "image.tar.gz not present (RUN_UPLOADS=${RUN_UPLOADS}); building image locally"
            docker build -t costscope:ci .
          fi
      - name: Trivy Image (via tools image)
        env:
          TRIVY_IMAGE: costscope:ci
        run: |
          CI_TOOLS_IMAGE="${{ env.CI_TOOLS_IMAGE }}" \
          bash ./scripts/ci/run-in-ci-image.sh --with-docker-sock -- bash ./scripts/security/run-trivy-image.sh
      - if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image
          path: trivy-image.json

  aggregate:
    name: Aggregate & Gate
    if: ${{ github.actor != 'nektos/act' && needs.setup.outputs.is-act != 'true' }}
    runs-on: ubuntu-latest
    needs: [sbom, govulncheck, gosec, secrets, trivy-fs, trivy-image, setup]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Record run metadata (early)
        run: ./scripts/ci/record-run-metadata.sh
      - name: Download artifacts
        if: env.RUN_UPLOADS == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: "*"
          path: artifacts
      - name: Prepare workspace
        run: |
          cp artifacts/govulncheck/govulncheck.json . 2>/dev/null || true
          cp artifacts/gosec/gosec.json . 2>/dev/null || true
          cp artifacts/gitleaks/gitleaks-report.json . 2>/dev/null || true
          cp artifacts/trivy-fs/trivy-fs.json . 2>/dev/null || true
          cp artifacts/trivy-image/trivy-image.json . 2>/dev/null || true
          cp artifacts/sbom/sbom.json . 2>/dev/null || true
          chmod +x scripts/security/aggregate-security.sh
      - name: Record run metadata
        run: ./scripts/ci/record-run-metadata.sh
      - name: Aggregate Security
        run: make security-gate
      - name: Ensure summary includes run metadata
        run: |
          mkdir -p docs/security
          # Ensure run-metadata is included at top of human summary
          if [ -f docs/security/run-metadata.yaml ]; then
            echo "## Run metadata" > docs/security/security-summary.md.tmp
            sed -n '1,200p' docs/security/run-metadata.yaml >> docs/security/security-summary.md.tmp || true
            echo "" >> docs/security/security-summary.md.tmp
          fi
          if [ -f docs/security/security-summary.md ]; then
            cat docs/security/security-summary.md >> docs/security/security-summary.md.tmp || true
            mv docs/security/security-summary.md.tmp docs/security/security-summary.md
          else
            mv docs/security/security-summary.md.tmp docs/security/security-summary.md || true
          fi
      - name: Upload Summary Artifacts
        if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-summary
          path: |
            docs/security/security-summary.md
            docs/security/security-summary.json
      - name: Post PR Comment Summary
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          path: docs/security/security-summary.md
      - name: Fail if gate failed
        run: |
          status=$(jq -r .status docs/security/security-summary.json)
          if [ "$status" != "PASS" ]; then echo "Gate failed"; exit 1; fi
      - name: Upload SBOM to run
        if: env.RUN_UPLOADS == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-pass-through
          path: sbom.json
      - name: Job Summary
        run: |
          echo '### Security Summary' >> $GITHUB_STEP_SUMMARY
          cat docs/security/security-summary.md >> $GITHUB_STEP_SUMMARY
