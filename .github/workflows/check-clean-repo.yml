name: check-clean-repo

on:
  pull_request:

jobs:
  check-clean:
    name: Ensure repository cleanliness
    runs-on: ubuntu-latest
    steps:
      - name: Early guard (skip under act unless full)
        run: |
          if [ "${{ github.actor }}" = "nektos/act" ] && [ "${ACT_FULL:-false}" != "true" ]; then
            echo "[act] Skipping check-clean-repo under act (enable --full to run)"
            exit 0
          fi
      - name: Checkout
        # pinned actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Run clean-repo check
        if: ${{ github.actor != 'nektos/act' }}
        run: |
          set -euo pipefail
          # Fail if any bypass env is present in the environment
          if [ -n "${SMOKE_ALLOW_DIRTY:-}" ]; then
            echo "Disallowed env SMOKE_ALLOW_DIRTY present in CI" >&2
            exit 1
          fi
          scripts/check-clean-repo.sh || { echo 'Repository is dirty; commit or stash changes before opening PR' >&2; exit 1; }
