name: Production coverage guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  resolve-ci-image:
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          : "${CI_IMAGE_REPO:=ghcr.io/costscope/ci-base}"
          TAG="${CI_IMAGE_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "CI_IMAGE_TAG is not set; please set it in repo variables or .github/act.secrets" >&2
            # As a safe fallback, still emit latest but warn
            TAG="latest"
            echo "[warn] Falling back to latest (not recommended)" >&2
          fi
          IMG="$CI_IMAGE_REPO:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

  coverage-guard-production:
    name: Run production coverage guard
    runs-on: ubuntu-latest
    needs: resolve-ci-image
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: "Sanity: go version"
        run: go version

      - name: Cache Go modules
        # pinned actions/cache@6f8efc29b200d32929f49075959781ed54ec270c — source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/pkg
            ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run production coverage guard
        run: make coverage-guard-production
