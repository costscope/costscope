name: Production coverage guard

on:
  push:
    # Temporary: run on push; will migrate some to tags later
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  _env_init:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.detect.outputs.is_act }}
    steps:
      - id: detect
        shell: bash
        run: |
          if [ "${IS_ACT:-}" = "true" ] || [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
  resolve-ci-image:
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
      CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
      CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - id: out
        run: bash ./scripts/ci/resolve-ci-image.sh

  coverage-guard-production:
    name: Run production coverage guard
    runs-on: ubuntu-latest
    needs: [resolve-ci-image, _env_init]
    timeout-minutes: 5
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    steps:
      - name: Early guard (skip under act unless full)
        id: guard
        env:
          IS_ACT_DETECTED: ${{ needs._env_init.outputs.is_act }}
        run: |
          if [ "${IS_ACT_DETECTED}" = "true" ] && [ "${ACT_FULL:-false}" != "true" ]; then
            echo "[act] Skipping coverage guard under act (enable full mode to run)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        # pinned actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0

      - name: Ensure baseline file exists
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          # Seed a default baseline if missing to prevent false negatives on older branches
          if [ ! -f configs/coverage/production.baseline ]; then
            echo "[coverage-guard] baseline missing; seeding default 92.0" >&2
            mkdir -p configs/coverage
            echo "92" > configs/coverage/production.baseline
          fi

      - name: "Sanity: go version"
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: go version

      - name: Run production coverage guard
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: make SHELL=/bin/bash coverage-guard-production

      - name: Summary header
        if: always()
        run: echo '### Production Coverage Guard' >> $GITHUB_STEP_SUMMARY

      - name: Summary (skipped)
        if: always() && steps.guard.outputs.skip == 'true'
        run: echo ' Coverage guard skipped under act (enable full mode to run)' >> $GITHUB_STEP_SUMMARY

      - name: Summary (success)
        if: always() && steps.guard.outputs.skip != 'true' && success()
        run: echo ' Coverage within expected bounds' >> $GITHUB_STEP_SUMMARY

      - name: Summary (failure)
        if: always() && steps.guard.outputs.skip != 'true' && !success()
        run: echo ' Coverage check failed' >> $GITHUB_STEP_SUMMARY
