name: Production coverage guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  coverage-guard-production:
    name: Run production coverage guard
    runs-on: ubuntu-latest
    container: ghcr.io/costscope/ci-base:latest
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Go
        # pinned actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 — source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
        with:
          go-version: "1.24"

      - name: "Sanity: go version"
        run: go version

      - name: Cache Go modules
        # pinned actions/cache@6f8efc29b200d32929f49075959781ed54ec270c — source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/pkg
            ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run production coverage guard
        run: make coverage-guard-production
