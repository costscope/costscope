name: Container Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/smoke-containers.yml
      - scripts/ci/smoke-containers.sh
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/smoke-containers.yml
      - scripts/ci/smoke-containers.sh
  workflow_dispatch: {}

jobs:
  smoke-containers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_STD: ghcr.io/${{ github.repository_owner }}/costscope:smoke-${{ github.sha }}
      IMAGE_DISTROLESS: ghcr.io/${{ github.repository_owner }}/costscope:smoke-distroless-${{ github.sha }}
    steps:
      - name: Detect act runtime
        id: detect-act
        run: |
          set -euo pipefail
          if [ "${ACT:-}" = "true" ] || [ "${IS_ACT:-}" = "true" ] || [ "${ACT_FULL:-}" = "true" ]; then
            echo "is_act=true" >> "$GITHUB_OUTPUT"
            echo "Detected local act runtime"
          else
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up QEMU (multi-arch future proof)
        # Skip on local `act` runs to avoid binfmt permission issues.
        if: ${{ runner.os == 'Linux' && steps.detect-act.outputs.is_act != 'true' }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v2
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        # pinned docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 — source: https://github.com/docker/setup-buildx-action/commits/main (2025-09-28)
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        # Skip GHCR login for local act runs where secrets are unavailable
        if: ${{ steps.detect-act.outputs.is_act != 'true' }}
        # pinned docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef — source: https://github.com/docker/login-action/commits/main (2025-09-28)
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standard image
        env:
          IS_ACT: ${{ steps.detect-act.outputs.is_act }}
          DOCKER_BUILDKIT: 1
        run: |
          set -euo pipefail
          docker build -t "$IMAGE_STD" -f Dockerfile .
          if [ "${IS_ACT}" != "true" ]; then
            docker push "$IMAGE_STD"
          else
            echo "[act] Skipping push for $IMAGE_STD"
          fi

      - name: Build distroless image (re-using built binary)
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -euo pipefail
          bash ./scripts/ci/build-distroless-from-image.sh "$IMAGE_STD" "$IMAGE_DISTROLESS"

      - name: Run smoke tests
        env:
          IS_ACT: ${{ steps.detect-act.outputs.is_act }}
        run: |
          set -euo pipefail
          # When running under act (local simulation) networking and docker
          # port bindings can be unreliable; skip the full smoke script in that case
          if [ "${IS_ACT}" = "true" ]; then
            echo "[act] Detected local act runtime; skipping full smoke-containers.sh to avoid Docker binding issues"
            exit 0
          fi
          ./scripts/ci/smoke-containers.sh

      - name: Upload smoke logs
        if: ${{ always() && steps.detect-act.outputs.is_act != 'true' }}
        # pinned actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 — source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs
          path: smoke-logs

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo "### Container Smoke Tests" >> $GITHUB_STEP_SUMMARY
          if [ -d smoke-logs ]; then
            for f in smoke-logs/*.log; do \
              echo "#### ${f}" >> $GITHUB_STEP_SUMMARY; \
              echo "\n\n<details><summary>$(basename \"$f\")</summary>" >> $GITHUB_STEP_SUMMARY; \
              sed 's/^/    /' "$f" | head -n 120 >> $GITHUB_STEP_SUMMARY; \
              echo '</details>' >> $GITHUB_STEP_SUMMARY; \
            done
          fi
          echo "Images: $IMAGE_STD / $IMAGE_DISTROLESS" >> $GITHUB_STEP_SUMMARY
