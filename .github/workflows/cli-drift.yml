name: CLI Command Drift Guard

on:
  pull_request:
    paths:
      - "cmd/modules/analytics/commands/command_spec.yaml"
      - "cmd/modules/multicloud/commands/command_spec.yaml"
      - "scripts/tools/commandgen/**"
      - "cmd/modules/analytics/commands/zz_generated_command_builder.go"
      - "cmd/modules/multicloud/commands/zz_generated_command_builder.go"
      - "Makefile"
  push:
    # Temporary: run on push; will migrate some to tags later
    branches: [main]
    paths:
      - "cmd/modules/analytics/commands/command_spec.yaml"
      - "cmd/modules/multicloud/commands/command_spec.yaml"
      - "scripts/tools/commandgen/**"
      - "cmd/modules/analytics/commands/zz_generated_command_builder.go"
      - "cmd/modules/multicloud/commands/zz_generated_command_builder.go"
      - "Makefile"

jobs:
  resolve-ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: out
        env:
          CI_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ci-base
          CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
          CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
        run: bash ./scripts/ci/resolve-ci-image.sh
  cli-drift:
    runs-on: ubuntu-latest
    # Run inside pre-built CI base image to avoid re-installing toolchain
    needs: resolve-ci-image
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
    steps:
      - name: Checkout
        # pinned actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: CLI drift check
        shell: bash
        run: bash scripts/ci/cli-drift-check.sh
      - name: Upload diff artifact
        if: ${{ always() && github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: cli-command-diff
          path: |
            cli-diff.patch
            cli-drift-summary.txt
          if-no-files-found: ignore
