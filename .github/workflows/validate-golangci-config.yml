name: Validate golangci-lint config

on:
  pull_request:
    paths:
      - ".golangci.yml"

jobs:
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: echo "Skipping golangci-lint config validation under act; run 'yq' locally if needed."
  validate-yaml:
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    name: Validate .golangci.yml syntax
    container: ghcr.io/costscope/ci-base:latest
    steps:
      - name: Checkout
        # pinned actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: "1.24"

      - name: Install yq (via Go)
        run: |
          GO111MODULE=on go install github.com/mikefarah/yq/v4@v4.30.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate .golangci.yml
        run: |
          echo "Validating .golangci.yml"
          if ! yq eval '.' .golangci.yml >/dev/null 2>&1; then
            echo "Invalid YAML in .golangci.yml" >&2
            yq eval '.' .golangci.yml || true
            exit 1
          fi
          echo ".golangci.yml is valid YAML"
