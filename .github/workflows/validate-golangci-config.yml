name: Validate golangci-lint config

on:
  pull_request:
    paths:
      - ".golangci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: echo "Skipping golangci-lint config validation under act; run 'yq' locally if needed."
  resolve-ci-image:
    if: ${{ github.actor != 'nektos/act' }}
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
      CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
      CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - id: out
        run: bash ./scripts/ci/resolve-ci-image.sh

  validate-yaml:
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    needs: resolve-ci-image
    name: Validate .golangci.yml syntax
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate .golangci.yml
        run: bash scripts/ci/validate-golangci-config.sh
