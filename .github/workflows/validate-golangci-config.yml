name: Validate golangci-lint config

on:
  pull_request:
    paths:
      - ".golangci.yml"

jobs:
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: echo "Skipping golangci-lint config validation under act; run 'yq' locally if needed."
  resolve-ci-image:
    if: ${{ github.actor != 'nektos/act' }}
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          : "${CI_IMAGE_REPO:=ghcr.io/costscope/ci-base}"
          TAG="${CI_IMAGE_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "CI_IMAGE_TAG is not set; please set it in repo variables or .github/act.secrets" >&2
            TAG="latest"
            echo "[warn] Falling back to latest (not recommended)" >&2
          fi
          IMG="$CI_IMAGE_REPO:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

  validate-yaml:
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    needs: resolve-ci-image
    name: Validate .golangci.yml syntax
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    steps:
      - name: Checkout
        # pinned actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Validate .golangci.yml
        run: |
          echo "Validating .golangci.yml"
          if ! yq eval '.' .golangci.yml >/dev/null 2>&1; then
            echo "Invalid YAML in .golangci.yml" >&2
            yq eval '.' .golangci.yml || true
            exit 1
          fi
          echo ".golangci.yml is valid YAML"
