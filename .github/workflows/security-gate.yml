name: security-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  resolve-ci-image:
    if: ${{ github.actor != 'nektos/act' }}
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          : "${CI_IMAGE_REPO:=ghcr.io/costscope/ci-base}"
          TAG="${CI_IMAGE_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "CI_IMAGE_TAG is not set; please set it in repo variables or .github/act.secrets" >&2
            TAG="latest"
            echo "[warn] Falling back to latest (not recommended)" >&2
          fi
          IMG="$CI_IMAGE_REPO:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: |
          echo "security-gate guarded to skip under act; providing a successful placeholder."
          echo "Tip: locally run 'make security-tools-install && bash scripts/security-gate.sh' for parity."
  security-gate:
    if: ${{ github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    needs: resolve-ci-image
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    timeout-minutes: 30
    env:
      RUN_UPLOADS: "false"
      GITLEAKS_VERSION: 8.18.1
      GOSEC_VERSION: v2.21.0
      GOVULNCHECK_VERSION: v1.1.1
      TRIVY_VERSION: v0.51.1
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
      GOSEC_FAIL_LEVEL: HIGH
      TRIVY_SEVERITIES: CRITICAL,HIGH
      GITLEAKS_ALLOW_FINDINGS: "0"
      FAIL_ON_MISSING_TOOLS: "1"
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Record run metadata (early)
        run: |
          if [ -z "$ACTIONS_RUNTIME_TOKEN" ]; then
            echo "note: ACTIONS_RUNTIME_TOKEN not present (likely local/act run)" > SECURITY_RUN_METADATA.md
          else
            echo "note: ACTIONS_RUNTIME_TOKEN present" > SECURITY_RUN_METADATA.md
          fi

      - name: "Sanity: go version"
        run: go version

      - name: Cache security data
        # pinned actions/cache@6f8efc29b200d32929f49075959781ed54ec270c - source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            .trivy-cache
          key: sec-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ env.TRIVY_VERSION }}

      - name: Verify security toolchain
        run: |
          set -euxo pipefail
          trivy --version
          gitleaks version
          gosec -version
          govulncheck -version

      - name: Pre-download Trivy DB
        run: trivy --cache-dir "$TRIVY_CACHE_DIR" image --download-db-only alpine:3.19 || true

      - name: Run security gate
        run: |
          chmod +x scripts/security-gate.sh
          bash scripts/security-gate.sh

      - name: Record run metadata
        run: |
          if [ -z "$ACTIONS_RUNTIME_TOKEN" ]; then
            echo "note: ACTIONS_RUNTIME_TOKEN not present (likely local/act run)" > SECURITY_RUN_METADATA.md
          else
            echo "note: ACTIONS_RUNTIME_TOKEN present" > SECURITY_RUN_METADATA.md
          fi

      - name: Ensure SECURITY_REPORT.md exists
        if: always()
        run: |
          if [ ! -f SECURITY_REPORT.md ]; then
            echo "# SECURITY REPORT - placeholder" > SECURITY_REPORT.md
            echo "A prior step failed to generate the full SECURITY_REPORT.md. Check earlier logs for errors." >> SECURITY_REPORT.md
          fi

      - name: Append summary
        if: always()
        run: |
          echo '## SECURITY REPORT' >> "$GITHUB_STEP_SUMMARY"
          if [ -f SECURITY_RUN_METADATA.md ]; then
            echo '### Run metadata' >> "$GITHUB_STEP_SUMMARY"
            cat SECURITY_RUN_METADATA.md >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
          fi
          sed -n '1,120p' SECURITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: env.RUN_UPLOADS == 'true'
        # pinned actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 - source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-gate-artifacts
          path: |
            SECURITY_REPORT.md
            SECURITY_RUN_METADATA.md
            gitleaks-report.json
            gosec-report.json
            govulncheck-report.json
            trivy-report.json
