name: security-gate

on:
  pull_request:
  push:
    # Temporary: run on push; will migrate some to tags later
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-lint-on-push:
    # Run a lightweight security lint on push; keep heavy scans gated
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Actions pinning (dry-run)
        run: bash scripts/tools/pin-actions.sh --dry-run
      - name: Summary
        run: |
          echo '### security-lint on push' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ran pin-actions in dry-run mode. Heavy scans remain gated to PR/dispatch.' >> "$GITHUB_STEP_SUMMARY"

  _env_init:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.detect.outputs.is_act }}
      act_full: ${{ steps.detect.outputs.act_full }}
    steps:
      - id: detect
        shell: bash
        run: |
          if [ "${IS_ACT:-}" = "true" ] || [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${ACT_FULL:-false}" = "true" ]; then
            echo "act_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "act_full=false" >> "$GITHUB_OUTPUT"
          fi

  resolve-ci-image:
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    needs: [_env_init]
    if: ${{ needs._env_init.outputs.is_act != 'true' }}
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
      # Prefer repo variable CI_TOOLS_IMAGE; fall back to pinned digest for determinism
      CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE || 'ghcr.io/costscope/ci-base@sha256:7d6d716eb9bab9f581feb498162fd8a24775fcf306a9ee724c2185b12aa9c05f' }}
      CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - id: out
        run: bash ./scripts/ci/resolve-ci-image.sh

  noop-act:
    runs-on: ubuntu-latest
    needs: [_env_init]
    if: ${{ needs._env_init.outputs.is_act == 'true' && needs._env_init.outputs.act_full != 'true' }}
    steps:
      - name: noop (act)
        run: |
          echo "security-gate guarded to skip under act; providing a successful placeholder."
          echo "Tip: locally run 'make security-tools-install && bash scripts/security-gate.sh' for parity."

  security-gate:
    runs-on: ubuntu-latest
    needs: [resolve-ci-image, _env_init]
    if: ${{ needs._env_init.outputs.is_act != 'true' }}
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    timeout-minutes: 30
    env:
      RUN_UPLOADS: "false"
      # Versions aligned with ci-base image to avoid drift
      GITLEAKS_VERSION: 8.18.4
      GOSEC_VERSION: v2.21.4
      GOVULNCHECK_VERSION: v1.1.3
      TRIVY_VERSION: v0.56.2
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
      # Under act we may skip DB update to avoid heavy pulls; script reads TRIVY_FLAGS
      # Under ACT, always avoid DB updates (use cached DB if available via mounted cache)
      TRIVY_FLAGS: "${{ needs._env_init.outputs.is_act == 'true' && '--skip-db-update --skip-java-db-update' || '' }}"
      GOSEC_FAIL_LEVEL: HIGH
      TRIVY_SEVERITIES: CRITICAL,HIGH
      GITLEAKS_ALLOW_FINDINGS: "0"
      FAIL_ON_MISSING_TOOLS: "1"
    steps:
      - name: Checkout
        # pinned actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Record run metadata (early)
        run: |
          if [ -z "$ACTIONS_RUNTIME_TOKEN" ]; then
            echo "note: ACTIONS_RUNTIME_TOKEN not present (likely local/act run)" > SECURITY_RUN_METADATA.md
          else
            echo "note: ACTIONS_RUNTIME_TOKEN present" > SECURITY_RUN_METADATA.md
          fi

      - name: "Sanity: go version"
        run: go version

      - name: Cache security data
        if: ${{ needs._env_init.outputs.is_act != 'true' }}
        # pinned actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 - source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            .trivy-cache
          key: sec-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ env.TRIVY_VERSION }}

      - name: Verify security toolchain (no installs)
        shell: bash
        run: |
          set -euxo pipefail
          trivy --version
          gitleaks version
          gosec -version
          govulncheck -version

      - name: Pre-download Trivy DB
        # Skip DB download entirely under ACT to avoid heavy pulls/OOM in local runs
        if: ${{ needs._env_init.outputs.is_act != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TRIVY_CACHE_DIR"
          # Retry up to 3 times to mitigate transient network/registry issues
          for i in 1 2 3; do
            if trivy --cache-dir "$TRIVY_CACHE_DIR" image --download-db-only alpine:3.19; then
              break
            fi
            echo "[security-gate] trivy DB download attempt $i failed; retrying in $((i*5))s..." >&2
            sleep $((i*5))
          done
          true

      - name: Run security gate
        run: |
          chmod +x scripts/security-gate.sh
          bash scripts/security-gate.sh

      - name: Record run metadata
        run: |
          if [ -z "$ACTIONS_RUNTIME_TOKEN" ]; then
            echo "note: ACTIONS_RUNTIME_TOKEN not present (likely local/act run)" > SECURITY_RUN_METADATA.md
          else
            echo "note: ACTIONS_RUNTIME_TOKEN present" > SECURITY_RUN_METADATA.md
          fi

      - name: Ensure SECURITY_REPORT.md exists
        if: always()
        run: |
          if [ ! -f SECURITY_REPORT.md ]; then
            echo "# SECURITY REPORT - placeholder" > SECURITY_REPORT.md
            echo "A prior step failed to generate the full SECURITY_REPORT.md. Check earlier logs for errors." >> SECURITY_REPORT.md
          fi

      - name: Append summary
        if: always()
        run: |
          echo '## SECURITY REPORT' >> "$GITHUB_STEP_SUMMARY"
          if [ -f SECURITY_RUN_METADATA.md ]; then
            echo '### Run metadata' >> "$GITHUB_STEP_SUMMARY"
            cat SECURITY_RUN_METADATA.md >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
          fi
          sed -n '1,120p' SECURITY_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: env.RUN_UPLOADS == 'true'
        # pinned actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 - source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: security-gate-artifacts
          path: |
            SECURITY_REPORT.md
            SECURITY_RUN_METADATA.md
            gitleaks-report.json
            gosec-report.json
            govulncheck-report.json
            trivy-report.json
