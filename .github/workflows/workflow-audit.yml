name: Workflow Audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Audit workflows for risky patterns
        run: bash ./scripts/ci/workflow-audit.sh

      - name: Upload audit summary
        if: always()
        run: bash -c 'echo "## Workflow Audit Summary" >> $GITHUB_STEP_SUMMARY && echo "Checked .github/workflows for master/main/latest pins and curl|sh installers." >> $GITHUB_STEP_SUMMARY'
