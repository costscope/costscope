name: Workflow Audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  resolve-ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - id: out
        env:
          CI_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ci-base
          CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
          CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
        run: bash ./scripts/ci/resolve-ci-image.sh
  audit-workflows:
    runs-on: ubuntu-latest
    needs: resolve-ci-image
    # Use our prebuilt CI base image to avoid ad-hoc installs and ensure toolchain consistency.
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Audit workflows for risky patterns
        run: ./scripts/ci/workflow-audit.sh

      - name: Upload audit summary
        if: always()
        run: bash ./scripts/ci/workflow-audit-summary.sh
