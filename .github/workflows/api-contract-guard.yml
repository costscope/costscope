name: API Contract Guard

on:
  pull_request:
    paths:
      - "internal/api/**"
      - "api/**"
      - "cmd/tools/gen-openapi/**"
      - "scripts/tools/contract-diff.sh"
      - "Makefile"
  push:
    branches: [main, master]
    paths:
      - "internal/api/**"
      - "api/**"
      - "cmd/tools/gen-openapi/**"
      - "scripts/tools/contract-diff.sh"
      - "Makefile"
  workflow_dispatch:
    inputs:
      allow_api_diff:
        description: "Set to true to allow intentional breaking API diff (requires CHANGELOG note with OpenAPI/API contract)"
        required: false
        default: "false"

jobs:
  noop-act:
    # Provide a visible, successful job when running under nektos/act locally
    if: ${{ github.actor == 'nektos/act' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: |
          echo "This workflow is GitHub-only for contract diffs; under act this is a no-op."
          echo "Tip: use 'make contract-check' locally for a similar validation."
  contract-check:
    # Skip entire job when running under local `act` to avoid false failures and missing base specs
    # Allow running under act when invoked via workflow_dispatch (for local parity)
    if: ${{ github.actor != 'nektos/act' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/costscope/ci-base:latest
    steps:
      - name: Early guard (skip under act unless full)
        id: guard
        run: |
          if [ "${{ github.actor }}" = "nektos/act" ] && [ "${ACT_FULL:-false}" != "true" ]; then
            echo "[act] Skipping API contract guard under act (enable full mode to run)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
      - if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      # Ensure required build tools are present when running under act local runner
      - name: Ensure build tools (act)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ACT:-}" != "true" ]; then echo "[act] Skip build-tools install (not running under act)"; exit 0; fi
          if ! command -v make >/dev/null 2>&1; then
            echo "[act] Installing make inside job container…"
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make
          else
            echo "[act] make already present"
          fi

      # Go toolchain and oasdiff are preinstalled in the CI container image
      - name: Evaluate override flag (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "allow_api_diff input: '${{ github.event.inputs.allow_api_diff }}'"
          if [ "${{ github.event.inputs.allow_api_diff }}" = "true" ]; then
            echo "ALLOW_API_DIFF=1" >> $GITHUB_ENV
            echo "Override enabled (CHANGELOG entry still required)."
          else
            echo "Override not enabled."
          fi
      - name: Run contract check
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: make contract-check

      - name: Summary
        if: always()
        run: |
          echo '### API Contract Guard' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.guard.outputs.skip }}" = 'true' ]; then
            echo ' Contract check skipped under act (enable full mode to run)' >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" = 'success' ]; then
            echo ' Contract check passed' >> $GITHUB_STEP_SUMMARY
          else
            echo ' Contract check failed' >> $GITHUB_STEP_SUMMARY
          fi
