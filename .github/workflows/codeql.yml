name: CodeQL

on:
    push:
        # Temporary: run on push; will migrate some to tags later
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: read
    security-events: write

jobs:
    noop-act:
        # Run this lightweight noop when running locally under act
        # Some local runners set actor to 'github-actions[bot]' instead of 'nektos/act',
        # so treat both as local act to avoid attempting CodeQL under act.
        if: ${{ github.actor == 'nektos/act' || github.actor == 'github-actions[bot]' }}
        runs-on: ubuntu-latest
        steps:
            - name: noop (act)
              run: echo "Skipping CodeQL under act; use GitHub-hosted runners for real analysis."

    analyze:
        # Run only on GitHub-hosted (skip under act)
        if: ${{ github.actor != 'nektos/act' && github.actor != 'github-actions[bot]' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Checkout repository
              # pinned actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

            - name: Initialize CodeQL (Go)
              # pinned github/codeql-action@528ca598d956c91826bd742262cdfc5d02b77710 — source: https://github.com/github/codeql-action/commits/main
              uses: github/codeql-action/init@528ca598d956c91826bd742262cdfc5d02b77710
              with:
                  languages: go

            - name: Autobuild
              uses: github/codeql-action/autobuild@528ca598d956c91826bd742262cdfc5d02b77710

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@528ca598d956c91826bd742262cdfc5d02b77710
              with:
                  category: "/language:go"
