name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (SemVer, e.g. v0.1.0-rc1)"
        required: true
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: "true"

permissions:
  contents: write
  id-token: write # for keyless signing (cosign)

env:
  GO_VERSION: "1.24.x"
  PROJECT_NAME: costscope
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/costscope
  # Align with supply-chain and scripts/supply-chain/gen-sbom.sh default
  SYFT_VERSION: v1.33.0
  GITCLIFF_VERSION: v0.10.0
  COSIGN_VERSION: v2.2.4

jobs:
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    name: noop (act)
    runs-on: ubuntu-latest
    steps:
      - name: Explain act path
        run: |
          echo "Release workflow performs signing, artifact uploads, and GH release creation."
          echo "Under nektos/act we skip all jobs; use 'make build' locally to validate."
  require-ci-tools-image-pin:
    if: ${{ github.actor != 'nektos/act' }}
    name: Require CI tools image pin (no drift)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ci_tools_image: ${{ steps.check.outputs.ci_tools_image }}
    steps:
      - name: Load CI_TOOLS_IMAGE from repository variables (if set)
        env:
          GH_API: https://api.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          name="CI_TOOLS_IMAGE"
          url="${GH_API}/repos/${owner}/${repo}/actions/variables/${name}"
          hdrs=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          status=$(curl -sS -o /tmp/var.json -w "%{http_code}" "${hdrs[@]}" "$url") || true
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            val=$(sed -n 's/.*"value"\s*:\s*"\{0,1\([^"}]*\)\{0,1\}".*/\1/p' /tmp/var.json | head -n1)
            if [ -n "$val" ]; then
              echo "CI_TOOLS_IMAGE=$val" >> "$GITHUB_ENV"
              echo "Loaded CI_TOOLS_IMAGE from repository variable: $val"
            fi
          else
            echo "No repository variable CI_TOOLS_IMAGE found (status $status); using workflow vars/defaults."
          fi
      - name: Enforce non-floating CI_TOOLS_IMAGE
        id: check
        run: |
          set -euo pipefail
          IMAGE="${CI_TOOLS_IMAGE:-}"
          if [ -z "$IMAGE" ]; then
            echo "[warn] CI_TOOLS_IMAGE not set in env; resolver may use CI_IMAGE_TAG."
            # Default to a clearly floating ref to trigger failure unless overridden
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER:-costscope}/ci-base:latest"
          fi
          if echo "$IMAGE" | grep -qE ':(latest|main|dev)$'; then
            echo "[error] CI_TOOLS_IMAGE uses a floating tag ($IMAGE)." >&2
            echo "        Please set repository variable CI_TOOLS_IMAGE to an immutable reference (tag with date/sha or @sha256 digest)." >&2
            exit 1
          fi
          echo "Using CI_TOOLS_IMAGE: $IMAGE"
          echo "ci_tools_image=$IMAGE" >> "$GITHUB_OUTPUT"
  resolve-ci-image:
    if: ${{ github.actor != 'nektos/act' }}
    needs: [require-ci-tools-image-pin]
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - id: out
        env:
          CI_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ci-base
          CI_TOOLS_IMAGE: ${{ needs.require-ci-tools-image-pin.outputs.ci_tools_image }}
          CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
        run: bash ./scripts/ci/resolve-ci-image.sh
  sbom:
    if: ${{ github.actor != 'nektos/act' }}
    name: sbom-verify (source tree)
    runs-on: ubuntu-latest
    needs: [resolve-ci-image]
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
      options: --user 0:0 --privileged
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Ensure clean working tree
        run: |
          set -euo pipefail
          if [ "${SMOKE_ALLOW_DIRTY:-}" != "" ]; then
            echo "Disallowed environment variable SMOKE_ALLOW_DIRTY detected in CI" >&2
            exit 1
          fi
          scripts/check-clean-repo.sh || { echo 'Repository is dirty; aborting release prepare step' >&2; exit 1; }
      - name: Toolchain (container)
        run: |
          syft version
          go version
      - name: Generate & validate SBOM (make sbom-syft + sbom-verify)
        run: |
          make sbom-syft
          make sbom-verify
      - name: Upload SBOM artifact (pre-build)
        # pinned actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 — source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-source
          path: |
            sbom-syft.json
            sbom.json
  prepare:
    # Only run prepare when triggered by a tag ref or when manually dispatched
    if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    needs: [resolve-ci-image]
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
      options: --user 0:0 --privileged
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Derive version
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: bash ./scripts/release/derive-version.sh

      - name: Verify git-cliff in image
        run: git-cliff --version

      - name: Generate / update CHANGELOG
        run: bash ./scripts/release/generate-changelog.sh "${{ steps.meta.outputs.version }}"

      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    if: ${{ github.actor != 'nektos/act' }}
    needs: [prepare, sbom]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: "Sanity: go version"
        run: go version
      - name: Build binary
        run: |
          set -euo pipefail
          echo "Building $PROJECT_NAME for ${{ matrix.goos }} / ${{ matrix.goarch }} ($VERSION)"
          out="${PROJECT_NAME}-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "-s -w -X main.version=$VERSION -extldflags '-Wl,-dead_strip -Wl,-x'" -trimpath -o "$out" .
          tar czf "$out.tar.gz" "$out"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            costscope-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}
            costscope-${{ env.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  aggregate:
    if: ${{ github.actor != 'nektos/act' }}
    needs: [prepare, build, sbom, resolve-ci-image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
      options: --user 0:0 --privileged
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Download build artifacts
        # pinned actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 — source: https://github.com/actions/download-artifact/commits/main (2025-09-28)
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: dist
      - name: List artifacts
        run: ls -R dist || true
      - name: Toolchain (container)
        run: |
          syft version
          cosign version
      - name: Generate SBOM (source)
        run: syft dir:. -o cyclonedx-json=sbom.json
      - name: Checksums + sign + attest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash ./scripts/release/checksums-and-sign.sh
      - name: Upload aggregated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            dist
            checksums.txt
            checksums.txt.sig
            sbom.json

      - name: Download release notes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: release-notes
          path: .

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            dist/**
            checksums.txt
            checksums.txt.sig
            sbom.json

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: bash ./scripts/release/summary.sh
