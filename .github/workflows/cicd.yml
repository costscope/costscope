# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci-cd

env:
    # Centralized versions for consistency across jobs
    GO_VERSION: "1.24.x"
    GOVULNCHECK_VERSION: latest
    TRIVY_VERSION: "0.56.2"
    # CI_IMAGE_TAG is expected to be set via Actions variables (repo/organization) or act env
    # Avoid floating tags in CI; fallback to 'latest' is handled by resolve step with warning.
    # Act detection defaults (act runner can override via -e)
    IS_ACT: "false" # quoted so expression parser treats as string
    ACT_FULL: "false" # quoted so expression parser treats as string

concurrency:
    group: ci-cd-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # Enable local execution via act and manual runs in GitHub UI.
    # Safe addition: does nothing unless explicitly triggered.
    workflow_dispatch:

jobs:
    resolve-ci-image:
        name: Resolve CI tools image
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.out.outputs.image }}
            generic: ${{ steps.out.outputs.generic }}
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
            - id: out
              env:
                  CI_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ci-base
                  CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
                  CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
                  # Allow ':latest' fallback only when running under act
                  RESOLVE_CI_IMAGE_ALLOW_LATEST: ${{ github.actor == 'nektos/act' }}
                  # Hint detect script that we're under act in this early job
                  IS_ACT: ${{ github.actor == 'nektos/act' }}
              shell: bash
              run: |
                  set -euo pipefail
                  echo "[resolve-ci-image] Starting resolution"
                  # Try normal resolution first; if it fails (e.g., env not set), set a safe fallback.
                  if bash ./scripts/ci/resolve-ci-image.sh; then
                    echo "[resolve-ci-image] Resolution script succeeded"
                    echo "generic=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "[resolve-ci-image] Resolution script failed; applying fallback image" >&2
                    if [ "${GITHUB_ACTOR:-}" = "nektos/act" ] || [ "${IS_ACT:-}" = "true" ]; then
                      echo "image=catthehacker/ubuntu:full-latest" >> "$GITHUB_OUTPUT"
                      echo "[resolve-ci-image] Using fallback image for act: catthehacker/ubuntu:full-latest" >&2
                    else
                      echo "image=ubuntu:22.04" >> "$GITHUB_OUTPUT"
                      echo "[resolve-ci-image] Using generic fallback image: ubuntu:22.04" >&2
                    fi
                    echo "generic=true" >> "$GITHUB_OUTPUT"
                  fi
    build-test-scan-sign-push:
        # Allow matrix job under act; internal guard step will skip non-slim variants early.
        if: ${{ always() }}
        name: build-test-scan-sign-push (${{ matrix.variant }})
        runs-on: ubuntu-latest
        needs: resolve-ci-image
        container:
            image: ${{ needs.resolve-ci-image.outputs.image }}
        strategy:
            fail-fast: false
            matrix:
                variant: [slim, sqlite, duckdb]
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

            - name: Skip non-slim variants under act (guard)
              id: variant_guard
              if: ${{ always() }}
              run: bash ./scripts/ci/skip-non-slim-under-act.sh "${{ matrix.variant }}"

            - name: Detect act runtime
              if: ${{ steps.variant_guard.outputs.skipped != 'true' }}
              id: detect_act
              run: bash ./scripts/ci/detect-act.sh

            - name: Detect runtime token presence
              if: ${{ steps.variant_guard.outputs.skipped != 'true' }}
              id: token_check
              run: |
                  if [ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
                    echo "present=true" >> "$GITHUB_OUTPUT";
                    echo "[ci] ACTIONS_RUNTIME_TOKEN present";
                  else
                    echo "present=false" >> "$GITHUB_OUTPUT";
                    echo "[ci] ACTIONS_RUNTIME_TOKEN missing (likely act)";
                  fi

            - name: Set up Go
              if: ${{ steps.variant_guard.outputs.skipped != 'true' }}
              uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true
                  cache-dependency-path: |
                      **/go.sum

            - name: "Sanity: go version"
              if: ${{ steps.variant_guard.outputs.skipped != 'true' }}
              run: go version

            - name: Prepare smoke fixtures (for act)
              if: ${{ (steps.detect_act.outputs.is_act == 'true' || github.actor == 'nektos/act' || steps.token_check.outputs.present != 'true') && steps.variant_guard.outputs.skipped != 'true' }}
              run: bash ./scripts/ci/prepare-act-fixtures.sh

            - name: Build and test (matrix)
              if: ${{ steps.variant_guard.outputs.skipped != 'true' }}
              run: |
                  if [ "${VARIANT_SKIPPED:-false}" = "true" ]; then
                    echo "[guard] Variant skipped earlier; short-circuit build/test"; exit 0; fi
                  ./scripts/ci/build-test-matrix.sh "${{ matrix.variant }}"

            - name: Spec-driven CLI builders drift check
              if: ${{ matrix.variant == 'slim' }}
              run: make gen-commands-drift

            - name: Upload CLI drift artifacts (if any)
              if: ${{ always() && matrix.variant == 'slim' && steps.token_check.outputs.present == 'true' && github.actor != 'nektos/act' }}
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
              with:
                  name: cli-drift-artifacts
                  path: |
                      cli-drift-summary.txt
                      cli-diff.patch
                  if-no-files-found: ignore

            - name: Integration CLI drift check
              if: ${{ matrix.variant == 'slim' }}
              run: |
                  if [ "${IS_ACT:-false}" = "true" ] && [ ! -f integration_commands.json ]; then
                    echo "[act] integration_commands.json baseline missing; generating via make gen-integration-cli-docs"
                    make gen-integration-cli-docs
                  fi
                  make gen-integration-cli-drift

            - name: Duplication gate
              if: ${{ matrix.variant == 'slim' }}
              run: make duplicates-gate

            - name: End-to-end pipeline tests & collect reports
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' }}
              run: bash ./scripts/ci/run-e2e-and-collect.sh

            - name: Summarize E2E results
              if: ${{ always() && matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' }}
              run: ./scripts/ci/e2e-summarize.sh

            - name: Build invariants CI tool (duckdb)
              if: ${{ matrix.variant == 'duckdb' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' }}
              run: bash ./scripts/ci/build-invariants-ci.sh

            - name: Run invariants check (JSON report)
              if: ${{ matrix.variant == 'duckdb' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' }}
              run: bash ./scripts/ci/run-invariants.sh

            - name: Upload invariants artifacts
              if: ${{ always() && matrix.variant == 'duckdb' && steps.token_check.outputs.present == 'true' && github.actor != 'nektos/act' && steps.detect_act.outputs.is_act != 'true' && env.IS_ACT != 'true' }}
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
              with:
                  name: invariants-artifacts
                  path: invariants-artifacts

            - name: Upload E2E artifacts
              if: ${{ always() && matrix.variant == 'slim' && steps.token_check.outputs.present == 'true' && env.IS_ACT != 'true' && steps.detect_act.outputs.is_act != 'true' && github.actor != 'nektos/act' }}
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
              with:
                  name: e2e-pipeline-artifacts
                  path: e2e-artifacts

            - name: Go vet
              if: ${{ matrix.variant == 'slim' }}
              run: go vet ./...

            - name: govulncheck
              if: ${{ matrix.variant == 'slim' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              run: bash -c 'govulncheck ./...'

            - name: Security scan (gosec)
              if: ${{ matrix.variant == 'slim' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: securego/gosec@6be2b51fd78feca86af91f5186b7964d76cb1256
              with:
                  args: -exclude-dir scripts/tools -exclude=G304,G115 ./...

            - name: Secrets scan (gitleaks)
              if: ${{ matrix.variant == 'slim' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
              env:
                  GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
              with:
                  args: detect --source . --no-banner --redact --config .gitleaks.toml

            - name: Docker image vulnerability scan (Trivy)
              if: ${{ matrix.variant == 'slim' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
              with:
                  version: ${{ env.TRIVY_VERSION }}
                  scan-type: fs
                  ignore-unfixed: true
                  format: table
                  output: trivy.txt
                  severity: CRITICAL,HIGH

            - name: Set up Docker Buildx
              if: ${{ matrix.variant == 'slim' && steps.variant_guard.outputs.skipped != 'true' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

            - name: Login to GHCR
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              id: meta
              uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
              with:
                  images: ghcr.io/${{ github.repository_owner }}/costscope

            - name: Build image with SBOM and provenance
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  sbom: true
                  provenance: mode=max

            - name: Determine primary image ref
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              id: imgref
              run: |
                  bash ./scripts/ci/detect-primary-image-ref.sh <<'EOF'
                  ${{ steps.meta.outputs.tags }}
                  EOF

            - name: Trivy scan built image
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
              with:
                  version: ${{ env.TRIVY_VERSION }}
                  image-ref: ${{ steps.imgref.outputs.image_ref }}
                  format: table
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true

            - name: Install cosign
              if: ${{ matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

            - name: Sign image with cosign
              if: ${{ github.event_name != 'pull_request' && matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              env:
                  COSIGN_EXPERIMENTAL: 1
              run: |
                  IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
                  echo "Signing $IMAGE"
                  cosign sign --yes "$IMAGE"

            - name: Determine ZAP target
              if: ${{ matrix.variant == 'slim' }}
              id: zap
              env:
                  ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
              run: bash ./scripts/ci/detect-zap-target.sh

            - name: Optional DAST with OWASP ZAP Baseline
              if: ${{ steps.zap.outputs.enabled == 'true' && matrix.variant == 'slim' && steps.detect_act.outputs.is_act != 'true' && needs.resolve-ci-image.outputs.generic != 'true' }}
              uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
              with:
                  target: ${{ steps.zap.outputs.target }}
                  cmd_options: "-a -m 5"

    test-casbinpoc:
        name: test (casbinpoc)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

            - name: Set up Go
              uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true
                  cache-dependency-path: |
                      **/go.sum

            - name: "Sanity: go version"
              run: go version

            - name: Prepare smoke fixtures (ensure required CSV fixtures exist)
              run: |
                  if [ ! -f tests/fixtures/aws/cur_smoke.csv ] || [ ! -f tests/fixtures/azure/usage_smoke.csv ] || [ ! -f tests/fixtures/gcp/usage_smoke.csv ]; then
                    echo "[ci] Generating smoke fixtures for casbinpoc tests (missing one or more CSVs)";
                    bash ./scripts/ci/prepare-act-fixtures.sh;
                  else
                    echo "[ci] Smoke fixtures already present; skipping generation";
                  fi

            - name: Run tests with casbinpoc tag (verbose JSON)
              run: |
                  set -euo pipefail
                  go mod download
                  # JSON output aids log parsing and failure triage on hosted runners
                  go test -tags casbinpoc -count=1 -json ./... | tee test-report.json

            - name: Upload test report (JSON)
              if: ${{ always() && github.actor != 'nektos/act' }}
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
              with:
                  name: casbinpoc-test-report
                  path: test-report.json
                  if-no-files-found: ignore

    helm-deploy:
        needs: build-test-scan-sign-push
        runs-on: ubuntu-latest
        # Only deploy from main on real GitHub runners with required secrets present.
        # This gates out act (no secrets) and accidental runs without KUBECONFIG.
        if: ${{ github.ref == 'refs/heads/main' && github.actor != 'nektos/act' }}
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

            - name: Check required secrets
              id: prereq
              env:
                  KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
                  COSTSCOPE_JWT_SECRET: ${{ secrets.COSTSCOPE_JWT_SECRET }}
              run: |
                  set -euo pipefail
                  missing=()
                  if [ -z "${KUBECONFIG_B64:-}" ]; then missing+=(KUBECONFIG_B64); fi
                  if [ -z "${COSTSCOPE_JWT_SECRET:-}" ]; then missing+=(COSTSCOPE_JWT_SECRET); fi
                  if [ ${#missing[@]} -gt 0 ]; then
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                    echo "[deploy] Missing required secrets: ${missing[*]}. Skipping helm deploy."
                  else
                    echo "ready=true" >> "$GITHUB_OUTPUT"
                    echo "[deploy] All required secrets present. Proceeding with helm deploy."
                  fi

            - name: Set up Helm
              if: ${{ steps.prereq.outputs.ready == 'true' }}
              uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
              with:
                  version: v3.15.2

            - name: Deploy to cluster
              if: ${{ steps.prereq.outputs.ready == 'true' }}
              env:
                  KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
                  COSTSCOPE_JWT_SECRET: ${{ secrets.COSTSCOPE_JWT_SECRET }}
                  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/costscope
                  IMAGE_TAG: ${{ github.sha }}
              run: bash ./scripts/ci/helm-deploy.sh
