name: supply-chain

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Makefile"
      - ".github/workflows/supply-chain.yml"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write
  id-token: write # needed for cosign keyless

env:
  GO_VERSION: "1.24.x"
  # Pin to a known-good Syft release; must match upstream asset naming (syft_<ver>_linux_<arch>.tar.gz)
  # Align with scripts/supply-chain/gen-sbom.sh default (v1.33.0) to avoid drift
  SYFT_VERSION: v1.33.0
  COSIGN_VERSION: v2.2.4

jobs:
  build-act:
    # Local Act path: run when the actor is nektos/act or github-actions[bot] (Act default)
    if: ${{ github.actor == 'nektos/act' || github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Minimal build and SBOM (act)
        run: |
          set -euo pipefail
          echo "Running minimal local build path under act (no signing/publish)"
          if [ -f scripts/ci/retry.sh ]; then bash scripts/ci/retry.sh 2 3 make build-production || make build; else make build-production || make build; fi
          if command -v go >/dev/null 2>&1; then :; else echo "go not present in act image; continuing"; fi
          echo "Skipping SBOM under Act to avoid on-the-fly tool installs; covered in CI image path"
          echo "act path complete"
  resolve-ci-image:
    if: ${{ !(github.actor == 'nektos/act' || github.actor == 'github-actions[bot]') }}
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          : "${CI_IMAGE_REPO:=ghcr.io/costscope/ci-base}"
          TAG="${CI_IMAGE_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "CI_IMAGE_TAG is not set; please set it in repo variables or .github/act.secrets" >&2
            TAG="latest"
            echo "[warn] Falling back to latest (not recommended)" >&2
          fi
          IMG="$CI_IMAGE_REPO:$TAG"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

  build-and-verify:
    if: ${{ !(github.actor == 'nektos/act' || github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    needs: resolve-ci-image
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Build production binary
        run: make build-production

      - name: Generate SBOM
        run: make sbom

      - name: Generate checksums
        run: make checksums

      - name: Sign checksums
        env:
          COSIGN_EXPERIMENTAL: 1
        run: make sign-checksums

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: make verify-checksums

      - name: Upload supply chain artifacts
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-artifacts
          path: |
            sbom.json
            checksums.txt
            checksums.txt.sig
            bin/costscope-production

      - name: Summary
        run: |
          echo '### Supply Chain Job Summary' >> $GITHUB_STEP_SUMMARY
          echo '* SBOM generated & uploaded' >> $GITHUB_STEP_SUMMARY
          echo '* Checksums signed & verified (keyless cosign)' >> $GITHUB_STEP_SUMMARY
          echo '* Binary + artifacts available as workflow artifacts' >> $GITHUB_STEP_SUMMARY
