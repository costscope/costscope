name: supply-chain

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Makefile"
      - ".github/workflows/supply-chain.yml"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write
  id-token: write # needed for cosign keyless

env:
  GO_VERSION: "1.24.x"
  # Pin to a known-good Syft release; must match upstream asset naming (syft_<ver>_linux_<arch>.tar.gz)
  # Align with scripts/supply-chain/gen-sbom.sh default (v1.33.0) to avoid drift
  SYFT_VERSION: v1.33.0
  COSIGN_VERSION: v2.2.4

jobs:
  _env_init:
    name: _env_init
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.detect.outputs.is_act }}
      act_full: ${{ steps.detect.outputs.act_full }}
    steps:
      - name: Detect act runtime
        id: detect
        shell: bash
        run: |
          if [ "${IS_ACT:-}" = "true" ] || [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${ACT_FULL:-false}" = "true" ]; then
            echo "act_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "act_full=false" >> "$GITHUB_OUTPUT"
          fi

  noop-act:
    if: ${{ needs._env_init.outputs.is_act == 'true' && needs._env_init.outputs.act_full != 'true' }}
    needs: [_env_init]
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        shell: bash
        run: |
          echo "supply-chain guarded to skip under act; providing a successful placeholder."
          echo "Tip: locally run 'make build-production && make sbom' for parity, or rely on CI image path in GitHub Actions."

  resolve-ci-image:
    if: ${{ needs._env_init.outputs.is_act != 'true' || needs._env_init.outputs.act_full == 'true' }}
    needs: [_env_init]
    name: Resolve CI tools image
    runs-on: ubuntu-latest
    outputs:
      ci_tools_image: ${{ steps.out.outputs.image }}
    env:
      CI_IMAGE_REPO: ghcr.io/costscope/ci-base
      CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
      CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - id: out
        run: bash ./scripts/ci/resolve-ci-image.sh

  build-and-verify:
    if: ${{ needs._env_init.outputs.is_act != 'true' || needs._env_init.outputs.act_full == 'true' }}
    runs-on: ubuntu-latest
    needs: [_env_init, resolve-ci-image]
    container: ${{ needs.resolve-ci-image.outputs.ci_tools_image }}
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 - source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Build production binary
        run: make build-production

      - name: Generate SBOM
        run: make sbom

      - name: Generate checksums
        run: make checksums

      - name: Sign checksums (act offline)
        if: ${{ needs._env_init.outputs.is_act == 'true' }}
        run: |
          echo "[act] Using offline pseudo-signing (sign-checksums-act)"
          make sign-checksums-act

      - name: Sign checksums (gha keyless)
        if: ${{ needs._env_init.outputs.is_act != 'true' }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: make sign-checksums

      - name: Verify signature (act offline)
        if: ${{ needs._env_init.outputs.is_act == 'true' }}
        run: |
          echo "[act] Verifying offline pseudo-signature (verify-checksums-act)"
          make verify-checksums-act

      - name: Verify signature (gha keyless)
        if: ${{ needs._env_init.outputs.is_act != 'true' }}
        env:
          COSIGN_EXPERIMENTAL: 1
        run: make verify-checksums

      - name: Upload supply chain artifacts
        # Skip under act regardless of ACT_FULL, since ACTIONS_RUNTIME_TOKEN is unavailable
        if: ${{ needs._env_init.outputs.is_act != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-artifacts
          path: |
            sbom.json
            checksums.txt
            checksums.txt.sig
            bin/costscope-production

      - name: Save artifacts locally (act)
        if: ${{ needs._env_init.outputs.is_act == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          out_dir=/data/supply-chain
          mkdir -p "$out_dir"
          # Copy if present; tolerate missing files gracefully
          for f in sbom.json sbom-syft.json checksums.txt checksums.txt.sig bin/costscope-production; do
            if [ -f "$f" ]; then
              cp -v "$f" "$out_dir/" || true
            fi
          done
          echo "Saved artifacts to $out_dir (mounted by act runner)"

      - name: Summary (act)
        if: ${{ needs._env_init.outputs.is_act == 'true' }}
        run: |
          echo '### Supply Chain Job Summary' >> $GITHUB_STEP_SUMMARY
          echo '* SBOM generated & saved locally' >> $GITHUB_STEP_SUMMARY
          echo '* Checksums signed & verified (offline pseudo-signing – act)' >> $GITHUB_STEP_SUMMARY
          echo '* Binary + artifacts saved under /data/supply-chain (act runner)' >> $GITHUB_STEP_SUMMARY

      - name: Summary (gha)
        if: ${{ needs._env_init.outputs.is_act != 'true' }}
        run: |
          echo '### Supply Chain Job Summary' >> $GITHUB_STEP_SUMMARY
          echo '* SBOM generated & uploaded' >> $GITHUB_STEP_SUMMARY
          echo '* Checksums signed & verified (keyless cosign)' >> $GITHUB_STEP_SUMMARY
          echo '* Binary + artifacts available as workflow artifacts' >> $GITHUB_STEP_SUMMARY
