name: Data Parity + Invariants Guard

on:
  push:
    # Temporary: enable run on push to avoid "skipped" status; heavy steps are no-op on push.
    # Some paths will migrate to tag-based triggers later.
    branches: [main]
    paths:
      - internal/core/focus/conversion/**
      - scripts/tools/parity-check/**
      - tests/perf/**
      - tests/fixtures/quality/baseline_invariants.json
      - Makefile
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    paths:
      - internal/core/focus/conversion/**
      - scripts/tools/parity-check/**
      - tests/perf/**
      - tests/fixtures/quality/baseline_invariants.json
      - Makefile
      - go.mod
      - go.sum
  workflow_dispatch: {}

jobs:
  noop-on-push:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Noop on push
        run: |
          echo '### data-parity-guard (noop on push)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Parity + invariants runs only on PRs/dispatch to save CI minutes.' >> "$GITHUB_STEP_SUMMARY"
  noop-act:
    if: ${{ github.actor == 'nektos/act' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: echo "Data Parity + Invariants guard skipped under act; run 'make data-parity-guard' locally."
  data-parity:
    if: ${{ github.event_name != 'push' && github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    env:
      PARITY_TOLERANCE: 1e-9
      INVARIANTS_TOLERANCE: 0.01
      INVARIANTS_BASELINE: tests/fixtures/quality/baseline_invariants.json
    steps:
      - name: Checkout
        # pinned actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Go
        # pinned actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 — source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v4
        with:
          go-version-file: go.mod

      - name: Download deps
        run: go mod download

      - name: Build slim binary (fast/unified conversions)
        run: make prepare-parity-binaries

      - name: Baseline sanity (warn-only)
        run: bash scripts/guards/check_baseline_sanity.sh || true

      - name: Ensure synthetic dataset
        run: |
          if [ ! -f tests/perf/aws-cur-synth.csv.gz ]; then
            make perf-gen-synth
          fi

      - name: Generate invariants baseline if missing
        run: |
          if [ ! -f "$INVARIANTS_BASELINE" ]; then
            echo "Baseline not found: $INVARIANTS_BASELINE — generating from unified parquet"
            # Ensure unified parquet exists (produced by parity runs)
            if [ ! -f focus_unified.parquet ]; then
              echo "Generating unified parquet via parity pre-run"
              make data-parity-guard || true
            fi
            # Build release binary for baseline generator
            make build-release
            bash scripts/generate-invariants-baseline.sh focus_unified.parquet "$INVARIANTS_BASELINE" "$INVARIANTS_TOLERANCE"
            git status --porcelain || true
          fi

      - name: Run data parity + invariants guard
        run: make data-parity-guard

      - name: Upload artifacts
        # Non-blocking: artifact uploads can fail under local act (no runtime token)
        if: ${{ always() && github.actor != 'nektos/act' }}
        continue-on-error: true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: data-parity-guard-artifacts
          path: |
            parity.json
            invariants.json
            invariants_current.json
            invariants_engine.txt
            focus_fast.parquet
            focus_unified.parquet
