name: notice-drift

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "NOTICE"
      - "Makefile"
      - "scripts/license/**"
      - "licenses.tpl"
      - ".github/workflows/notice-drift.yml"
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "NOTICE"
      - "Makefile"
      - "scripts/license/**"
      - "licenses.tpl"
      - ".github/workflows/notice-drift.yml"

permissions:
  contents: read

jobs:
  _env_init:
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.detect.outputs.is_act }}
      act_full: ${{ steps.detect.outputs.act_full }}
    steps:
      - id: detect
        shell: bash
        run: |
          if [ "${IS_ACT:-}" = "true" ] || [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then
            echo "is_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_act=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${ACT_FULL:-false}" = "true" ]; then
            echo "act_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "act_full=false" >> "$GITHUB_OUTPUT"
          fi
  resolve-ci-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: out
        env:
          CI_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ci-contract
          CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE }}
          CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
        run: bash ./scripts/ci/resolve-ci-image.sh
  notice-drift:
    runs-on: ubuntu-latest
    needs: [resolve-ci-image, _env_init]
    container:
      image: ${{ needs.resolve-ci-image.outputs.image }}
    steps:
      - name: Early guard (skip under act unless full)
        id: guard
        env:
          IS_ACT_DETECTED: ${{ needs._env_init.outputs.is_act }}
        run: |
          if [ "${IS_ACT_DETECTED}" = "true" ] && [ "${ACT_FULL:-false}" != "true" ]; then
            echo "[act] Skipping notice-drift under act (enable --full to run)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Warm Go modules cache
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          go env GOPATH
          go mod download

      # Go toolchain is provided by the container image

      - name: NOTICE drift check
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: make notice-drift

      - name: Summary
        if: always()
        run: |
          echo '### NOTICE Drift Check' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.guard.outputs.skip }}" = 'true' ]; then
            echo ' NOTICE check skipped under act (enable full mode to run)' >> $GITHUB_STEP_SUMMARY
          elif [ "${{ job.status }}" = 'success' ]; then
            echo ' NOTICE up to date' >> $GITHUB_STEP_SUMMARY
          else
            echo ' NOTICE drift detected' >> $GITHUB_STEP_SUMMARY
          fi
