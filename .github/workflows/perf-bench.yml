name: Performance Benchmark

env:
  GO_VERSION: "1.24.x"
  # Pinned golangci-lint version used by CI to keep lint output stable
  # Use a version that supports product config v2
  WANT_VERSION: "v1.61.0"
  # Stable tool cache inside workspace to enable caching across steps without relying on dynamic env
  GOLANGCI_HOME: ${{ github.workspace }}/.cache/tools/golangci-lint

on:
  push:
    # Temporary: run on push; will migrate some to tags later
    branches: [main]
    paths:
      - internal/core/focus/**
      - scripts/tools/perf-bench/**
      - scripts/tools/perf-gen-synth/**
      - tests/perf/baseline_bench_results.json
      - go.mod
      - go.sum
  pull_request:
    branches: [main]
    paths:
      - internal/core/focus/**
      - scripts/tools/perf-bench/**
      - scripts/tools/perf-gen-synth/**
      - tests/perf/baseline_bench_results.json
      - go.mod
      - go.sum
  workflow_dispatch: {}

jobs:
  _env_init:
    name: Detect act/full mode
    runs-on: ubuntu-latest
    outputs:
      is_act: ${{ steps.detect.outputs.is_act }}
      act_full: ${{ steps.detect.outputs.act_full }}
    steps:
      - id: detect
        name: Detect
        shell: bash
        run: |
          set -euo pipefail
          IS_ACT_VAL=false
          if [ "${IS_ACT:-}" = "true" ] || [ "${ACT:-}" = "true" ] || [ "${GITHUB_ACTOR:-}" = "nektos/act" ]; then
            IS_ACT_VAL=true
          fi
          if [ "${ACT_FULL:-false}" = "true" ]; then
            ACT_FULL_VAL=true
          else
            ACT_FULL_VAL=false
          fi
          echo "is_act=${IS_ACT_VAL}" >> "$GITHUB_OUTPUT"
          echo "act_full=${ACT_FULL_VAL}" >> "$GITHUB_OUTPUT"
  lint-on-push:
    if: ${{ github.event_name == 'push' }}
    name: lightweight checks on push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go version
        run: go version
      - name: Module sanity
        run: bash scripts/ci/module-sanity.sh
      - name: Summary
        run: |
          echo '### perf-bench (lint on push)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ran go list for quick sanity. Full benchmarks remain gated to PR/dispatch.' >> "$GITHUB_STEP_SUMMARY"
  noop-act:
    needs: _env_init
    if: ${{ needs._env_init.outputs.is_act == 'true' && needs._env_init.outputs.act_full != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: noop (act)
        run: |
          echo "Performance bench workflow has GitHub-only upload steps; under act we provide a noop for parity."
  resolve-ci-image:
    needs: _env_init
    if: ${{ needs._env_init.outputs.is_act != 'true' || needs._env_init.outputs.act_full == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - id: out
        env:
          CI_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/ci-base
          # Prefer repo variable CI_TOOLS_IMAGE; fall back to pinned digest for determinism
          CI_TOOLS_IMAGE: ${{ vars.CI_TOOLS_IMAGE || 'ghcr.io/costscope/ci-base@sha256:7d6d716eb9bab9f581feb498162fd8a24775fcf306a9ee724c2185b12aa9c05f' }}
          CI_IMAGE_TAG: ${{ vars.CI_IMAGE_TAG }}
        run: bash ./scripts/ci/resolve-ci-image.sh
  perf-bench:
    needs: [_env_init, resolve-ci-image]
    if: ${{ needs._env_init.outputs.is_act != 'true' || needs._env_init.outputs.act_full == 'true' }}
    runs-on: ubuntu-latest
    container: ${{ needs.resolve-ci-image.outputs.image }}
    steps:
      - name: Checkout
        # pinned actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 — source: https://github.com/actions/checkout/commits/main (2025-09-28)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Prepare GOMODCACHE
        run: bash scripts/ci/prepare_gomodcache.sh

      - name: Cache Go modules (restore to temp)
        # pinned actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb — source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v3
        with:
          # Restore into a runner-local temporary directory to avoid direct
          # extraction into $GOMODCACHE which can produce conflicting file types
          # during archive restore. We'll promote into GOMODCACHE atomically.
          path: ${{ runner.temp }}/go-mod-cache-restore
          key: go-mod-cache-${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-go-${{ env.GO_VERSION }}-

      - name: Promote cached modules into GOMODCACHE safely
        run: |
          if command -v rsync >/dev/null 2>&1; then
            bash scripts/ci/promote_gomodcache.sh
          else
            echo "rsync not found; skipping promotion step"
          fi

      - name: Setup Go
        # pinned actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c — source: https://github.com/actions/setup-go/commits/main (2025-09-28)
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute tool paths
        run: |
          echo "GOBIN=${GOLANGCI_HOME}/${RUNNER_OS:-linux}-${RUNNER_ARCH:-amd64}/${WANT_VERSION}" >> "$GITHUB_ENV"
          mkdir -p "${GOLANGCI_HOME}/${RUNNER_OS:-linux}-${RUNNER_ARCH:-amd64}/${WANT_VERSION}"

      - name: Download deps (pre-warm modules)
        run: go mod download

      - name: Cache golangci-lint binary
        # pinned actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb — source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v3
        with:
          path: ${{ env.GOLANGCI_HOME }}/${{ runner.os }}-${{ runner.arch }}/${{ env.WANT_VERSION }}/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.WANT_VERSION }}

      - name: Generate code (mocks / codegen)
        run: |
          set -e
          if make -n generate >/dev/null 2>&1; then make generate; else go generate ./... || true; fi

      - name: Install golangci-lint (build with runner Go via go install)
        run: bash scripts/ci/install_golangci.sh

      - name: Show golangci-lint version
        run: |
          set -e
          GOLANGCI_BIN="$(command -v golangci-lint || true)"
          if [ -n "$GOLANGCI_BIN" ] && [ -x "$GOLANGCI_BIN" ]; then
            "$GOLANGCI_BIN" version || true
          else
            # Fallback to GOPATH location (older cache layout)
            ALT_BIN="$(go env GOPATH)/bin/golangci-lint"
            if [ -x "$ALT_BIN" ]; then
              "$ALT_BIN" version || true
            else
              echo "[warn] golangci-lint not found on PATH; continuing without version print"
            fi
          fi

      - name: Pre-lint diagnostics (go list + ls)
        run: bash scripts/ci/prelint_diagnostics.sh

      - name: Run golangci-lint (with duckdb build tag, perf scope)
        run: bash scripts/ci/run_golangci_perf.sh

      - name: Build release binary (for e2e)
        run: |
          # scripts/e2e/run.sh expects a repo-root ./costscope binary
          make build-release

      - name: Prepare e2e test fixtures
        run: |
          if [ -x ./scripts/e2e/run.sh ]; then ./scripts/e2e/run.sh; else echo "scripts/e2e/run.sh not found or not executable"; fi
          ls -la tmp/e2e/data || true
          test -f tmp/e2e/data/aws-cur.csv || (echo "Missing aws-cur.csv in tmp/e2e/data" && exit 1)
          test -f tmp/e2e/data/test.csv || (echo "Missing test.csv in tmp/e2e/data" && exit 1)

      - name: Generate synthetic dataset
        run: make perf-gen-synth

      - name: Run perf benchmark
        env:
          PERF_BENCH_DURATION_MAX: "1.15"
          PERF_BENCH_ALLOC_MAX: "1.20"
        run: bash scripts/ci/run_perf_bench.sh

      - name: Upload bench results artifact
        if: ${{ github.actor != 'nektos/act' }}
        # pinned actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f — source: https://github.com/actions/upload-artifact/commits/main (2025-09-28)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        continue-on-error: true
        with:
          name: perf-bench-results
          path: |
            bench_results.json
            perf_metrics.prom
            tests/perf/baseline_bench_results.json

      - name: Fail if regression detected
        if: ${{ always() }}
        run: |
          if grep -q '"overall_status": "fail"' bench_results.json; then
            echo "Performance regression detected" >&2
            exit 1
          fi

  perf-bench-perf-engine:
    name: Perf Engine Micro Benches (optional)
    runs-on: ubuntu-latest
    needs: [resolve-ci-image, perf-bench, _env_init]
    if: ${{ needs._env_init.outputs.is_act != 'true' || needs._env_init.outputs.act_full == 'true' }}
    container: ${{ needs.resolve-ci-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Prepare GOMODCACHE
        run: bash scripts/ci/prepare_gomodcache.sh

      - name: Cache Go modules (restore to temp)
        # pinned actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb — source: https://github.com/actions/cache/commits/main (2025-09-28)
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v3
        with:
          path: ${{ runner.temp }}/go-mod-cache-restore
          key: go-mod-cache-${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-cache-${{ runner.os }}-go-${{ env.GO_VERSION }}-

      - name: Promote cached modules into GOMODCACHE safely
        run: |
          if command -v rsync >/dev/null 2>&1; then
            bash scripts/ci/promote_gomodcache.sh
          else
            echo "rsync not found; skipping promotion step"
          fi

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v4
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download deps
        run: go mod download
      - name: Generate synthetic dataset
        run: make perf-gen-synth
      - name: Run perf benchmark (with perf engine)
        run: bash scripts/ci/run_perf_engine_micro.sh
      - name: Upload perf-engine bench artifact
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        continue-on-error: true
        with:
          name: perf-bench-perf-engine-results
          path: bench_results_perf_engine.json
      - name: Note status
        run: |
          if grep -q '"perf_engine"' bench_results_perf_engine.json; then
            echo "Perf engine micro-bench section present"; else echo "Perf engine section missing"; fi
