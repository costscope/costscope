name: Pin CI tools image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full image ref to pin (e.g., ghcr.io/costscope/ci-base:2025.10.12-<sha> or @sha256:<digest>). If empty, 'tag' will be used to build ghcr.io/<owner>/ci-base:<tag>."
        required: false
        default: ""
      tag:
        description: "Tag to pin for ghcr.io/<owner>/ci-base (e.g., 2025.10.12-<sha> or vX.Y.Z). Ignored if 'image' is provided."
        required: false
        default: ""
  repository_dispatch:
    types: [ci-tools-image-update]

permissions:
  contents: read
  actions: write

jobs:
  pin:
    if: ${{ github.actor != 'nektos/act' }}
    name: Update repository variable CI_TOOLS_IMAGE
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Resolve image reference
        id: resolve
        shell: bash
        env:
          CLIENT_IMAGE: ${{ github.event.client_payload.image }}
          CLIENT_TAG: ${{ github.event.client_payload.tag }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash ./scripts/ci/pin-ci-tools-resolve.sh

      - name: Create or update CI_TOOLS_IMAGE repo variable
        shell: bash
        env:
          GH_API: https://api.github.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: bash ./scripts/ci/pin-ci-tools-update-var.sh

      - name: Echo result
        run: echo "CI_TOOLS_IMAGE is now set to ${{ steps.resolve.outputs.image }}"
