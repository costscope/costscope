apiVersion: v1
kind: Service
metadata:
  name: {{ include "costscope.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "costscope.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  app.kubernetes.io/version: {{ .Chart.AppVersion }}
  app.kubernetes.io/part-of: costscope
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "costscope.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
