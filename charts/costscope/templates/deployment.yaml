apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "costscope.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "costscope.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: costscope
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "costscope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "costscope.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - api
            - enterprise
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            {{- if .Values.env.TLS_ENABLED }}
            - --tls-enabled
            - --tls-cert
            - {{ .Values.env.TLS_CERT_FILE | quote }}
            - --tls-key
            - {{ .Values.env.TLS_KEY_FILE | quote }}
            - --tls-min-version
            - {{ default "1.2" .Values.env.TLS_MIN_VERSION | quote }}
            {{- if .Values.env.TLS_CIPHER_SUITES }}
            - --tls-cipher-suites
            - {{ .Values.env.TLS_CIPHER_SUITES | quote }}
            {{- end }}
            - --tls-prefer-server-ciphers
            - {{ default true .Values.env.TLS_PREFER_SERVER_CIPHERS | ternary "true" "false" | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: ENV
              value: {{ .Values.env.ENV | quote }}
            - name: COSTSCOPE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "costscope.fullname" . }}
                  key: jwt-secret
            - name: COSTSCOPE_CORS_ORIGINS
              value: {{ .Values.env.CORS_ORIGINS | quote }}
            - name: COSTSCOPE_TLS_ENABLED
              value: {{ .Values.env.TLS_ENABLED | quote }}
            - name: COSTSCOPE_TLS_CERT_FILE
              value: {{ .Values.env.TLS_CERT_FILE | quote }}
            - name: COSTSCOPE_TLS_KEY_FILE
              value: {{ .Values.env.TLS_KEY_FILE | quote }}
            - name: COSTSCOPE_TLS_MIN_VERSION
              value: {{ .Values.env.TLS_MIN_VERSION | quote }}
            - name: COSTSCOPE_TLS_CIPHER_SUITES
              value: {{ .Values.env.TLS_CIPHER_SUITES | quote }}
            - name: COSTSCOPE_TLS_PREFER_SERVER_CIPHERS
              value: {{ .Values.env.TLS_PREFER_SERVER_CIPHERS | quote }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: {{ .Values.probes.scheme | default "HTTP" | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: {{ .Values.probes.scheme | default "HTTP" | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: {{ default "1000m" .Values.resources.limits.cpu | quote }}
              memory: {{ default "1Gi" .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ default "250m" .Values.resources.requests.cpu | quote }}
              memory: {{ default "256Mi" .Values.resources.requests.memory | quote }}
