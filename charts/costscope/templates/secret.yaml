apiVersion: v1
kind: Secret
metadata:
  name: {{ include "costscope.fullname" . }}
type: Opaque
stringData:
  {{- if not .Values.env.COSTSCOPE_JWT_SECRET }}
  {{- fail "env.COSTSCOPE_JWT_SECRET must be set (use --set env.COSTSCOPE_JWT_SECRET=...)" }}
  {{- end }}
  jwt-secret: {{ .Values.env.COSTSCOPE_JWT_SECRET | quote }}
